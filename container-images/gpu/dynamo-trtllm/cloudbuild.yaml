images:
  - ${_DESTINATION}

options:
  # The base image is about 17 GiB compressed and 35 GiB uncompressed, which
  # doesn't fit on the default build disk next to the compressed layers that
  # BuildKit keeps.
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - args:
      - build
      - --tag=${_DESTINATION}
      - container-images/gpu/dynamo-trtllm
    id: "Build Dynamo TensorRT-LLM image"
    name: "docker.io/docker:28.3.3-dind-alpine3.22"
    waitFor: ["-"]
