<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" font-family="Roboto, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d93025"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="20" y="34" font-size="20" font-weight="700" fill="#202124">The Secure Runtime on GKE: reference architecture</text>
  <text x="20" y="54" font-size="12" fill="#5f6368">ADK coding agent on Agent Substrate · gVisor sandboxes · golden snapshots · intent-scoped egress</text>

  <!-- Presenter -->
  <rect x="20" y="380" width="115" height="70" rx="8" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="77" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">Presenter</text>
  <text x="77" y="428" text-anchor="middle" font-size="11" fill="#5f6368">ADK Web UI</text>

  <!-- Google Cloud project -->
  <rect x="160" y="70" width="1020" height="790" rx="10" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="176" y="92" font-size="13" font-weight="700" fill="#5f6368">Google Cloud project</text>

  <!-- GKE cluster -->
  <rect x="180" y="105" width="980" height="585" rx="10" fill="#ffffff" stroke="#4285f4" stroke-width="2"/>
  <text x="196" y="127" font-size="13" font-weight="700" fill="#1a73e8">GKE Standard cluster (1.37+)</text>

  <!-- Namespace: agent-harness -->
  <rect x="200" y="140" width="220" height="510" rx="8" fill="#e8f0fe" stroke="#8ab4f8"/>
  <text x="212" y="160" font-size="13" font-weight="700" fill="#1967d2">Namespace: agent-harness</text>

  <rect x="220" y="200" width="180" height="90" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="310" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">ADK agent</text>
  <text x="310" y="252" text-anchor="middle" font-size="11" fill="#5f6368">Intent guard</text>
  <text x="310" y="268" text-anchor="middle" font-size="11" fill="#5f6368">(before_tool_callback)</text>

  <rect x="220" y="520" width="180" height="80" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="310" y="550" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">intent-extproc</text>
  <text x="310" y="569" text-anchor="middle" font-size="11" fill="#5f6368">Envoy ext_proc service</text>
  <text x="310" y="585" text-anchor="middle" font-size="11" fill="#5f6368">allowed method + path per actor</text>

  <!-- Namespace: ate-system -->
  <rect x="440" y="140" width="330" height="510" rx="8" fill="#fef7e0" stroke="#fdd663"/>
  <text x="452" y="160" font-size="13" font-weight="700" fill="#b06000">Namespace: ate-system (Agent Substrate)</text>

  <text x="460" y="188" font-size="11" fill="#5f6368" font-weight="700">CONTROL PLANE</text>
  <rect x="460" y="200" width="140" height="60" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="530" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">ate-api-server</text>
  <text x="530" y="244" text-anchor="middle" font-size="11" fill="#5f6368">actors, templates, policies</text>

  <rect x="615" y="275" width="135" height="45" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="682" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">PostgreSQL</text>
  <text x="682" y="311" text-anchor="middle" font-size="11" fill="#5f6368">state store</text>
  <line x1="590" y1="260" x2="640" y2="275" stroke="#5f6368" stroke-width="1.2"/>

  <rect x="615" y="330" width="135" height="40" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="682" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">atecontroller</text>
  <text x="682" y="363" text-anchor="middle" font-size="11" fill="#5f6368">reconciles WorkerPool</text>

  <text x="460" y="378" font-size="11" fill="#5f6368" font-weight="700">NETWORK PLANE</text>
  <rect x="460" y="385" width="140" height="70" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="530" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">atenet-router</text>
  <text x="530" y="430" text-anchor="middle" font-size="11" fill="#5f6368">mTLS ingress</text>
  <text x="530" y="445" text-anchor="middle" font-size="11" fill="#5f6368">wakes suspended actors</text>

  <rect x="615" y="480" width="135" height="80" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="682" y="503" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">atenet-egress</text>
  <text x="682" y="520" text-anchor="middle" font-size="11" fill="#5f6368">Envoy gateway</text>
  <text x="682" y="535" text-anchor="middle" font-size="11" fill="#5f6368">policy + TLS inspection</text>
  <text x="682" y="550" text-anchor="middle" font-size="11" fill="#5f6368">token injection</text>

  <rect x="615" y="580" width="135" height="55" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="682" y="602" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">credential provider</text>
  <text x="682" y="620" text-anchor="middle" font-size="11" fill="#5f6368">holds GitHub token</text>
  <line x1="682" y1="560" x2="682" y2="580" stroke="#5f6368" stroke-width="1.2"/>

  <!-- Node pool -->
  <rect x="790" y="140" width="350" height="510" rx="8" fill="#e6f4ea" stroke="#81c995"/>
  <text x="802" y="160" font-size="13" font-weight="700" fill="#137333">Node pool: c3-standard-4 (uniform CPU)</text>

  <rect x="810" y="185" width="310" height="50" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="965" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">atelet (DaemonSet)</text>
  <text x="965" y="223" text-anchor="middle" font-size="11" fill="#5f6368">restore · checkpoint · image cache</text>

  <rect x="810" y="255" width="310" height="380" rx="8" fill="#ffffff" stroke="#34a853" stroke-dasharray="6 4"/>
  <text x="822" y="275" font-size="13" font-weight="700" fill="#137333">Worker pod · swe-gvisor-pool</text>
  <text x="822" y="291" font-size="11" fill="#5f6368">ateworker-gvisor</text>

  <rect x="830" y="300" width="270" height="200" rx="8" fill="#fce8e6" stroke="#d93025" stroke-dasharray="6 4"/>
  <text x="842" y="318" font-size="13" font-weight="700" fill="#c5221f">gVisor sandbox (runsc)</text>

  <rect x="850" y="330" width="230" height="70" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="965" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">Actor: Python runner</text>
  <text x="965" y="373" text-anchor="middle" font-size="11" fill="#5f6368">pandas, scipy already in memory</text>
  <text x="965" y="389" text-anchor="middle" font-size="11" fill="#5f6368">no secrets · own actor-uid</text>

  <text x="965" y="425" text-anchor="middle" font-size="11" fill="#5f6368">private network namespace · minimal capabilities</text>

  <rect x="850" y="445" width="230" height="40" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="965" y="463" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">DNS relay</text>
  <text x="965" y="478" text-anchor="middle" font-size="11" fill="#5f6368">answers only hosts in policy</text>

  <rect x="830" y="515" width="270" height="45" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="965" y="535" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">atunnel</text>
  <text x="965" y="551" text-anchor="middle" font-size="11" fill="#5f6368">nftables redirect · mTLS with actor cert</text>

  <rect x="830" y="575" width="270" height="45" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-dasharray="4 3"/>
  <text x="965" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#5f6368">Suspended actors</text>
  <text x="965" y="610" text-anchor="middle" font-size="11" fill="#5f6368">no CPU or RAM used; state in snapshots</text>

  <!-- Managed services below cluster -->
  <rect x="440" y="715" width="250" height="70" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="565" y="743" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">Cloud Logging + Cloud Trace</text>
  <text x="565" y="762" text-anchor="middle" font-size="11" fill="#5f6368">audit trail keyed by ate.actor.uid</text>

  <rect x="840" y="715" width="250" height="70" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="965" y="743" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">Cloud Storage</text>
  <text x="965" y="762" text-anchor="middle" font-size="11" fill="#5f6368">golden snapshot tag + actor snapshots</text>

  <!-- External -->
  <text x="1210" y="360" font-size="13" font-weight="700" fill="#5f6368">Internet</text>
  <rect x="1210" y="380" width="170" height="60" rx="6" fill="#ffffff" stroke="#d93025" stroke-dasharray="5 3"/>
  <text x="1295" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">Hosts not in policy</text>
  <text x="1295" y="423" text-anchor="middle" font-size="11" fill="#5f6368">blocked</text>

  <rect x="1210" y="520" width="170" height="80" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/>
  <text x="1295" y="550" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">api.github.com</text>
  <text x="1295" y="569" text-anchor="middle" font-size="11" fill="#5f6368">GitHub REST API</text>
  <text x="1295" y="585" text-anchor="middle" font-size="11" fill="#5f6368">demo repo + seeded issues</text>

  <!-- Flows -->
  <!-- 1 Prompt -->
  <path d="M135,410 L220,250" stroke="#1a73e8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <circle cx="190" cy="305" r="12" fill="#1a73e8"/><text x="190" y="309" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>

  <!-- 2 Create EgressPolicy -->
  <path d="M400,225 L458,225" stroke="#1a73e8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <circle cx="428" cy="225" r="12" fill="#1a73e8"/><text x="428" y="229" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>

  <!-- 3 Register intent rule -->
  <path d="M310,290 L310,518" stroke="#1a73e8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <circle cx="310" cy="400" r="12" fill="#1a73e8"/><text x="310" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>

  <!-- 4 Tool call to router -->
  <path d="M400,275 L460,400" stroke="#1a73e8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <circle cx="430" cy="338" r="12" fill="#1a73e8"/><text x="430" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>

  <!-- 5 Router asks api-server to resume; api-server tells atelet -->
  <path d="M585,385 L585,262" stroke="#1a73e8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M600,215 L808,210" stroke="#1a73e8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <circle cx="705" cy="212" r="12" fill="#1a73e8"/><text x="705" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>

  <!-- atelet <-> Cloud Storage (snapshots) -->
  <path d="M1120,210 L1132,210 L1132,750 L1092,750" stroke="#5f6368" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrGray)"/>
  <text x="1124" y="705" font-size="11" fill="#5f6368" text-anchor="end">snapshots</text>

  <!-- 6 Restore actor into sandbox -->
  <path d="M1085,235 L1085,298" stroke="#1a73e8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <circle cx="1106" cy="266" r="12" fill="#1a73e8"/><text x="1106" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>

  <!-- DNS deny -->
  <path d="M1080,465 L1208,415" stroke="#d93025" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <text x="1150" y="458" font-size="11" fill="#d93025" font-weight="700">NXDOMAIN</text>

  <!-- 7 atunnel to atenet-egress -->
  <path d="M830,538 L752,520" stroke="#1a73e8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <circle cx="790" cy="512" r="12" fill="#1a73e8"/><text x="790" y="516" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">7</text>

  <!-- 8 egress checks intent-extproc -->
  <path d="M615,515 L402,555" stroke="#1a73e8" stroke-width="2" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <circle cx="508" cy="535" r="12" fill="#1a73e8"/><text x="508" y="539" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">8</text>

  <!-- 9 egress -> GitHub (allowed GET with real token) -->
  <path d="M750,495 L775,495 L775,670 L1190,670 L1190,560 L1208,560" stroke="#1a73e8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <circle cx="1000" cy="670" r="12" fill="#1a73e8"/><text x="1000" y="674" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">9</text>

  <!-- 10 audit -->
  <path d="M310,600 L310,750 L438,750" stroke="#5f6368" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrGray)"/>
  <path d="M682,635 L682,713" stroke="#5f6368" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrGray)"/>
  <circle cx="310" cy="703" r="12" fill="#1a73e8"/><text x="310" y="707" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">10</text>

  <!-- Act badges -->
  <rect x="1005" y="305" width="60" height="18" rx="9" fill="#d93025"/><text x="1035" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">ACT 1</text>
  <rect x="1050" y="189" width="60" height="18" rx="9" fill="#188038"/><text x="1080" y="202" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">ACT 2</text>
  <rect x="1020" y="719" width="60" height="18" rx="9" fill="#188038"/><text x="1050" y="732" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">ACT 2</text>
  <rect x="690" y="458" width="60" height="18" rx="9" fill="#e37400"/><text x="720" y="471" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">ACT 3</text>
  <rect x="330" y="492" width="60" height="18" rx="9" fill="#e37400"/><text x="360" y="505" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">ACT 3</text>
  <rect x="450" y="695" width="60" height="18" rx="9" fill="#7b1fa2"/><text x="480" y="708" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">ACT 4</text>

  <!-- Legend -->
  <text x="176" y="820" font-size="11" fill="#5f6368" font-weight="700">Legend:</text>
  <line x1="230" y1="816" x2="270" y2="816" stroke="#1a73e8" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="278" y="820" font-size="11" fill="#5f6368">request path (numbered steps)</text>
  <line x1="460" y1="816" x2="500" y2="816" stroke="#d93025" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrRed)"/><text x="508" y="820" font-size="11" fill="#5f6368">blocked</text>
  <line x1="570" y1="816" x2="610" y2="816" stroke="#5f6368" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrGray)"/><text x="618" y="820" font-size="11" fill="#5f6368">snapshots / audit data</text>
  <rect x="770" y="808" width="22" height="14" rx="3" fill="#fce8e6" stroke="#d93025" stroke-dasharray="4 3"/><text x="800" y="820" font-size="11" fill="#5f6368">sandbox boundary</text>
</svg>
