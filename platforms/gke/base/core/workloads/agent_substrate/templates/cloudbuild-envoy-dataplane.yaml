# Builds Agent Substrate's envoy-dataplane image with BuildKit. Since
# v1.0.0-rc.1 its Dockerfile uses `FROM --platform=$BUILDPLATFORM`, which the
# legacy builder behind `gcloud builds submit --tag` cannot parse.

images:
  - ${_DESTINATION}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - args:
      - build
      - --platform=linux/amd64
      - --tag=${_DESTINATION}
      - .
    id: "Build envoy-dataplane image"
    name: "docker.io/docker:28.3.3-dind-alpine3.22"
    waitFor: ["-"]
