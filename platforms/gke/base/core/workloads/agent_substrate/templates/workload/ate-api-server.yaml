apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-api-authentication
  namespace: ${ate_kubernetes_namespace}
data:
  authentication.yaml: |-
    actorIdentityJWTProvider: kubernetes
    jwtProviders:
    - name: kubernetes
      issuer: https://container.googleapis.com/v1/projects/${cluster_project_id}/locations/${cluster_region}/clusters/${cluster_name}
      audiences: [api.${ate_kubernetes_namespace}.svc]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-api-server-envvars
  namespace: ${ate_kubernetes_namespace}
data:
  ATE_API_ACTOR_JWT_ISSUER: "https://api.${ate_kubernetes_namespace}.svc"
  ATE_API_POSTGRES_CLOUDSQL_INSTANCE: "${ate_cloudsql_connection_name}"
  ATE_API_POSTGRES_OWNER_ROLE: "substrate_owner"
  ATE_API_POSTGRES_READ_WRITE_ROLE: "substrate_readwrite"
  CSQL_PROXY_AUTO_IAM_AUTHN: "true"
  CSQL_PROXY_HEALTH_CHECK: "true"
  CSQL_PROXY_HTTP_ADDRESS: "0.0.0.0"
  CSQL_PROXY_HTTP_PORT: "9801"
  CSQL_PROXY_PORT: "5432"
  CSQL_PROXY_PRIVATE_IP: "true"
  CSQL_PROXY_STRUCTURED_LOGS: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: ate-api-server-secret-envvars
  namespace: ${ate_kubernetes_namespace}
type: Opaque
stringData:
  ATE_API_POSTGRES_OWNER_CONNECTION_STRING: "user=${ate_db_iam_user} host=127.0.0.1 port=5432 dbname=atepg sslmode=disable"
  ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING: "user=${ate_db_iam_user} host=127.0.0.1 port=5432 dbname=atepg sslmode=disable"
  ATE_API_POSTGRES_SCHEMA: "substrate"
---
apiVersion: v1
kind: Secret
metadata:
  name: ate-api-server-postgres-init
  namespace: ${ate_kubernetes_namespace}
type: Opaque
stringData:
  POSTGRES_HOST: "${ate_postgres_private_ip}"
  POSTGRES_PASSWORD: "${ate_postgres_password}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ate-api-server
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["ate.dev"]
  resources: ["workerpools", "sandboxconfigs", "csidriverconfigs"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "watch", "list"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-api-server
  namespace: ${ate_kubernetes_namespace}
  annotations:
    iam.gke.io/gcp-service-account: ${ate_service_account_email}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-api-server
subjects:
- kind: ServiceAccount
  name: ate-api-server
  namespace: ${ate_kubernetes_namespace}
roleRef:
  kind: ClusterRole
  name: ate-api-server
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-api-server
  namespace: ${ate_kubernetes_namespace}
  labels:
    app: ate-api-server
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ate-api-server
  template:
    metadata:
      labels:
        app: ate-api-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: ate-api-server
      terminationGracePeriodSeconds: 40
      nodeSelector:
        resource-type: system
      tolerations:
      - effect: NoSchedule
        key: "components.gke.io/gke-managed-components"
        operator: "Equal"
        value: "true"
      initContainers:
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.2
        restartPolicy: Always
        args:
        - "$(ATE_API_POSTGRES_CLOUDSQL_INSTANCE)"
        envFrom:
        - configMapRef:
            name: ate-api-server-envvars
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /startup
            port: 9801
          periodSeconds: 1
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /liveness
            port: 9801
          initialDelaySeconds: 10
          periodSeconds: 10
      - name: postgres-role-init
        image: postgres:18-alpine
        envFrom:
        - secretRef:
            name: ate-api-server-postgres-init
        command:
        - sh
        - -c
        - |
          set -e
          psql "postgresql://postgres:$${POSTGRES_PASSWORD}@$${POSTGRES_HOST}:5432/atepg?sslmode=require" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$$$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'substrate_owner') THEN
              CREATE ROLE substrate_owner NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'substrate_readwrite') THEN
              CREATE ROLE substrate_readwrite NOLOGIN;
            END IF;
          END
          $$$$;
          GRANT substrate_owner TO postgres WITH SET TRUE;
          GRANT substrate_owner, substrate_readwrite TO "${ate_db_iam_user}";
          CREATE SCHEMA IF NOT EXISTS substrate AUTHORIZATION substrate_owner;
          GRANT USAGE ON SCHEMA substrate TO substrate_readwrite;
          ALTER DEFAULT PRIVILEGES FOR ROLE substrate_owner IN SCHEMA substrate
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO substrate_readwrite;
          ALTER DEFAULT PRIVILEGES FOR ROLE substrate_owner IN SCHEMA substrate
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO substrate_readwrite;
          ALTER DEFAULT PRIVILEGES FOR ROLE substrate_owner IN SCHEMA substrate
            GRANT EXECUTE ON ROUTINES TO substrate_readwrite;
          ALTER DEFAULT PRIVILEGES FOR ROLE substrate_owner IN SCHEMA substrate
            GRANT USAGE ON TYPES TO substrate_readwrite;
          SQL
      - name: objectstore-plugin
        image: ${ate_image_repository}/objectstore-plugin:${ate_version}
        restartPolicy: Always
        args:
        - control
        - --socket=/run/objectstore-plugin/control.sock
        startupProbe:
          exec:
            command:
            - /ko-app/objectstore-plugin
            - healthcheck
            - --socket=/run/objectstore-plugin/control.sock
          periodSeconds: 2
          failureThreshold: 30
        securityContext:
          capabilities:
            drop:
            - ALL
        env:
        - name: ATE_STORAGE_BACKEND
          value: "gcs"
        envFrom:
        - configMapRef:
            name: ate-otel-config
        volumeMounts:
        - name: objectstore-plugin
          mountPath: /run/objectstore-plugin
      containers:
      - name: ate-api-server
        image: ${ate_image_repository}/ateapi:${ate_version}
        args:
        - "--grpc-server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        - --authentication-config=/etc/ateapi/authentication/authentication.yaml
        - --postgres-read-write-connection-string=@env
        - --postgres-owner-connection-string=@env
        - --postgres-read-write-role=@env
        - --postgres-owner-role=@env
        - --postgres-schema=@env
        - --actor-id-jwt-pool=/run/actor-id-jwt-pool/pool.json
        - --actor-jwt-issuer=@env
        - --actor-id-ca-pool=/run/actor-id-ca-pool/pool.json
        - --atelet-client-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --pod-identity-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --default-egress-gateway-address=atenet-egress.${ate_kubernetes_namespace}.svc:443
        - --drain-delay=13s
        - --drain-timeout=15s
        - --objectstore-plugin-socket=/run/objectstore-plugin/control.sock
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        envFrom:
        - configMapRef:
            name: ate-otel-config
        - configMapRef:
            name: ate-api-server-envvars
            optional: true
        - secretRef:
            name: ate-api-server-secret-envvars
            optional: true
        volumeMounts:
        - name: objectstore-plugin
          mountPath: /run/objectstore-plugin
        - name: "servicedns"
          mountPath: "/run/servicedns.podcert.ate.dev"
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
        - name: "postgres"
          mountPath: "/run/postgres.podcert.ate.dev"
          readOnly: true
        - name: "actor-id-jwt-pool"
          mountPath: "/run/actor-id-jwt-pool"
        - name: "actor-id-ca-pool"
          mountPath: "/run/actor-id-ca-pool"
          readOnly: true
        - name: "authentication-config"
          mountPath: "/etc/ateapi/authentication"
          readOnly: true
        - name: "postgres-server-ca"
          mountPath: "/run/postgres-server-ca"
          readOnly: true
        ports:
        - containerPort: 443
        - name: prometheus
          containerPort: 9090
        - name: health
          containerPort: 9091
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: objectstore-plugin
        emptyDir: {}
      - name: "servicedns"
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: "podidentity"
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: "postgres"
        projected:
          sources:
          - podCertificate:
              signerName: postgres.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: substrate_owner_user.pem
              userAnnotations:
                postgres.podcert.ate.dev/username: substrate_owner_user
          - podCertificate:
              signerName: postgres.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: substrate_readwrite_user.pem
              userAnnotations:
                postgres.podcert.ate.dev/username: substrate_readwrite_user
      - name: "actor-id-jwt-pool"
        projected:
          sources:
          - secret:
              name: "actor-id-jwt-pool"
              items:
              - key: "pool"
                path: "pool.json"
      - name: "actor-id-ca-pool"
        projected:
          sources:
          - secret:
              name: "actor-id-ca-pool"
              items:
              - key: "pool"
                path: "pool.json"
      - name: "authentication-config"
        configMap:
          name: "ate-api-authentication"
      - name: "postgres-server-ca"
        secret:
          secretName: "postgres-server-ca"
          optional: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ate-api-server
  namespace: ${ate_kubernetes_namespace}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ate-api-server
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ${ate_kubernetes_namespace}
spec:
  clusterIP: None
  ipFamilyPolicy: PreferDualStack
  selector:
    app: ate-api-server
  ports:
  - name: grpc
    protocol: TCP
    port: 443
    targetPort: 443
