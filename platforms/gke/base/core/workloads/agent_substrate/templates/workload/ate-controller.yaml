apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-client
  namespace: ${ate_kubernetes_namespace}
  labels:
    apps: ate-client
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-controller
  namespace: ${ate_kubernetes_namespace}
  labels:
    apps: ate-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ate-controller
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
- apiGroups:
  - ate.dev
  resources:
  - sandboxconfigs
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ate.dev
  resources:
  - workerpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ate.dev
  resources:
  - workerpools/finalizers
  verbs:
  - update
- apiGroups:
  - ate.dev
  resources:
  - workerpools/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - certificates.k8s.io
  resources:
  - clustertrustbundles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - certificates.k8s.io
  resourceNames:
  - egress-mitm.ate.dev/*
  resources:
  - signers
  verbs:
  - attest
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ate-controller
  namespace: ${ate_kubernetes_namespace}
rules:
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ate-controller
subjects:
- kind: ServiceAccount
  name: ate-controller
  namespace: ${ate_kubernetes_namespace}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ate-controller
  namespace: ${ate_kubernetes_namespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ate-controller
subjects:
- kind: ServiceAccount
  name: ate-controller
  namespace: ${ate_kubernetes_namespace}
---
kind: Service
apiVersion: v1
metadata:
  name: ate-controller
  namespace: ${ate_kubernetes_namespace}
  labels:
    app: ate-controller
spec:
  selector:
    app: ate-controller
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-controller
  namespace: ${ate_kubernetes_namespace}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ate-controller
  template:
    metadata:
      labels:
        app: ate-controller
    spec:
      serviceAccountName: ate-controller
      nodeSelector:
        resource-type: system
      tolerations:
      - effect: NoSchedule
        key: "components.gke.io/gke-managed-components"
        operator: "Equal"
        value: "true"
      containers:
      - name: ate-controller
        image: ${ate_image_repository}/atecontroller:${ate_version}
        args:
        - --ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem
        - --ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --dns-egress-policy=enforce-in-atunnel
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        envFrom:
        - configMapRef:
            name: ate-otel-config
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: healthz
          containerPort: 8081
          protocol: TCP
        volumeMounts:
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
        - name: "servicedns-ca"
          mountPath: "/run/servicedns-ca"
      volumes:
      - name: "podidentity"
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: "servicedns-ca"
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
