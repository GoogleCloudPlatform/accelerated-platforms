apiVersion: v1
kind: ServiceAccount
metadata:
  name: atenet-router
  namespace: ${ate_kubernetes_namespace}
  labels:
    app: atenet-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atenet-router-endpointslices
  namespace: ${ate_kubernetes_namespace}
rules:
- apiGroups:
  - "discovery.k8s.io"
  resources:
  - endpointslices
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atenet-router-endpointslices
  namespace: ${ate_kubernetes_namespace}
subjects:
- kind: ServiceAccount
  name: atenet-router
  namespace: ${ate_kubernetes_namespace}
roleRef:
  kind: Role
  name: atenet-router-endpointslices
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atenet-router-envoy-config
  namespace: ${ate_kubernetes_namespace}
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901

    node:
      id: substrate-envoy-node
      cluster: substrate-router-cluster

    bootstrap_extensions:
    - name: envoy.bootstrap.internal_listener
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.bootstrap.internal_listener.v3.InternalListener

    dynamic_resources:
      lds_config:
        resource_api_version: V3
        ads: {}
      cds_config:
        resource_api_version: V3
        ads: {}
      ads_config:
        api_type: GRPC
        transport_api_version: V3
        grpc_services:
        - envoy_grpc:
            cluster_name: xds_cluster

    static_resources:
      listeners:
      - name: envoy_metrics
        stat_prefix: admin_metrics
        address:
          socket_address:
            address: "::"
            ipv4_compat: true
            port_value: 9902
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: admin_metrics
              route_config:
                name: envoy_metrics
                virtual_hosts:
                - name: envoy_metrics
                  domains: ["*"]
                  routes:
                  - match:
                      path: /stats/prometheus
                      headers:
                      - name: ":method"
                        string_match: { exact: GET }
                    route: { cluster: envoy_admin }
                  - match:
                      path: /ready
                      headers:
                      - name: ":method"
                        string_match: { exact: GET }
                    route: { cluster: envoy_admin }
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: envoy_admin
        connect_timeout: 0.25s
        type: STATIC
        load_assignment:
          cluster_name: envoy_admin
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 9901
      - name: xds_cluster
        connect_timeout: 0.25s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: xds_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 18000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atenet-router
  namespace: ${ate_kubernetes_namespace}
  labels:
    app: atenet-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-router
  template:
    metadata:
      labels:
        app: atenet-router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: atenet-router
      nodeSelector:
        resource-type: system
      tolerations:
      - effect: NoSchedule
        key: "components.gke.io/gke-managed-components"
        operator: "Equal"
        value: "true"
      terminationGracePeriodSeconds: 60
      containers:
      - name: atenet-router
        image: ${ate_image_repository}/atenet:${ate_version}
        args:
        - "router"
        - "--mode=ingress"
        - "--namespace=${ate_kubernetes_namespace}"
        - "--port-xds=18000"
        - "--port-extproc=50051"
        - "--extproc-address=127.0.0.1"
        - "--status-port=4040"
        - "--port-https=8443"
        - "--envoy-cert-path=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        - "--port-connect-tls=8444"
        - "--ingress-client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        - "--ingress-allowed-spiffe-ids=spiffe://cluster.local/ns/ate-e2e-router-client/sa/router-client"
        - "--ateapi-address=k8s:///api.${ate_kubernetes_namespace}.svc:443"
        - "--ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem"
        - "--ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem"
        - "--drain-delay=13s"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        envFrom:
        - configMapRef:
            name: ate-otel-config
        ports:
        - name: extproc
          containerPort: 50051
        - name: metrics
          containerPort: 9090
        - name: health
          containerPort: 9091
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
        - name: "servicedns-ca"
          mountPath: "/run/servicedns-ca"
        - name: "drain-signal"
          mountPath: "/var/run/atenet"
      - name: envoy
        image: ${ate_image_repository}/envoy-dataplane:${ate_version}
        command:
        - "/usr/local/bin/envoy"
        - "-c"
        - "/etc/envoy/envoy.yaml"
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "while [ ! -f /var/run/atenet/drain-complete ]; do sleep 0.5; done"]
        ports:
        - name: https
          containerPort: 8443
        - name: connect-tls
          containerPort: 8444
        - name: envoy-metrics
          containerPort: 9902
        readinessProbe:
          httpGet:
            path: /ready
            port: envoy-metrics
          periodSeconds: 2
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        - name: "servicedns"
          mountPath: "/run/servicedns.podcert.ate.dev"
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
        - name: "drain-signal"
          mountPath: "/var/run/atenet"
          readOnly: true
      volumes:
      - name: envoy-config
        configMap:
          name: atenet-router-envoy-config
      - name: "drain-signal"
        emptyDir: {}
      - name: "servicedns"
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: "podidentity"
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: "servicedns-ca"
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: atenet-router
  namespace: ${ate_kubernetes_namespace}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app: atenet-router
  ports:
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: connect-tls
    port: 8444
    targetPort: 8444
    protocol: TCP
