# Standard Kubernetes gVisor Pod used in Act 2 as the cold-start baseline.
# Unlike an Agent Substrate Actor (which restores pre-imported numpy/scipy/pandas/
# matplotlib memory pages from a Golden Snapshot in <500ms), this standard Pod
# must go through kube-scheduler placement, GKE Sandbox runtime initialization,
# container creation, and full Python scientific library import on startup (~15-25s).
apiVersion: v1
kind: Pod
metadata:
  name: cold-gvisor-baseline
  namespace: default
  labels:
    app: cold-gvisor-baseline
spec:
  runtimeClassName: gvisor
  nodeSelector:
    sandbox-runtime: gvisor
  restartPolicy: Never
  containers:
    - name: runner
      image: ${RUNNER_IMAGE}
      imagePullPolicy: Always
      env:
        - name: PORT
          value: "80"
      ports:
        - name: http
          containerPort: 80
      readinessProbe:
        httpGet:
          path: /readyz
          port: 80
        initialDelaySeconds: 1
        periodSeconds: 1
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
