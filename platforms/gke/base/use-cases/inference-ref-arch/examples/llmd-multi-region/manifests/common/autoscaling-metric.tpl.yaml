---
# Exports the vLLM KV cache utilization of every model server pod (both arms)
# as a load balancer custom metric (gke.named_metrics.kv-cache). The
# multi-cluster Gateway uses it with balancingMode: CUSTOM_METRICS to decide
# when a region is full and traffic should spill over to another region.
# https://cloud.google.com/kubernetes-engine/docs/how-to/setup-multicluster-inference-gateway
apiVersion: autoscaling.gke.io/v1beta1
kind: AutoscalingMetric
metadata:
  name: vllm-kv-cache
  namespace: ${MR_NAMESPACE}
spec:
  selector:
    matchLabels:
      llm-d.ai/role: decode
  # This is the endpoints/exportName form documented for the multi-cluster
  # Inference Gateway. The load balancer metric name is
  # gke.named_metrics.<exportName>.
  endpoints:
    - port: 8000
      path: /metrics
      metrics:
        - name: vllm:kv_cache_usage_perc
          exportName: kv-cache
