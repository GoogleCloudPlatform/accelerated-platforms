---
# On-demand CPU nodes for the benchmark clients. Several machine families are
# listed in priority order, so that a stockout of one family (for example,
# n4-standard in us-central1) doesn't block the benchmark.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: llm-mr-bench-cpu
spec:
  nodePoolAutoCreation:
    enabled: true
  priorities:
    - machineType: n4-standard-8
      spot: false
    - machineType: c4-standard-8
      spot: false
    - machineType: n2-standard-8
      spot: false
    - machineType: e2-standard-8
      spot: false
  whenUnsatisfiable: DoNotScaleUp
