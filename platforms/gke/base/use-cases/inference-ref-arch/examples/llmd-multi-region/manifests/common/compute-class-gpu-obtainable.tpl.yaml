# GPU compute class for regions without on-demand quota for the accelerator
# (selected per region with MR_COMPUTE_CLASS_REGION in mr.env). The platform's
# default GPU class tries on-demand first; with no on-demand quota, every new
# node then waits for the on-demand priorities to fail with QuotaExceeded and
# back off (5 minutes each) before it reaches flex-start or Spot. This class
# starts with the capacity that uses preemptible quota:
#   1. flex-start (Dynamic Workload Scheduler): not preempted during its
#      maximum run duration
#   2. Spot: can be preempted at any time; the HPA and the Deployment replace
#      a preempted replica
#   3. on-demand, for when on-demand quota is granted later
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: ${MR_NAMESPACE}-gpu-obtainable
spec:
  nodePoolAutoCreation:
    enabled: true
  nodePoolConfig:
    imageStreaming:
      enabled: true
  priorities:
    - flexStart:
        enabled: true
      gpu:
        count: ${MR_GPU_COUNT}
        driverVersion: latest
        type: nvidia-${MR_ACCELERATOR_TYPE}
      machineType: ${MR_GPU_MACHINE_TYPE}
      maxRunDurationSeconds: 604800
    - gpu:
        count: ${MR_GPU_COUNT}
        driverVersion: latest
        type: nvidia-${MR_ACCELERATOR_TYPE}
      machineType: ${MR_GPU_MACHINE_TYPE}
      spot: true
    - gpu:
        count: ${MR_GPU_COUNT}
        driverVersion: latest
        type: nvidia-${MR_ACCELERATOR_TYPE}
      machineType: ${MR_GPU_MACHINE_TYPE}
      spot: false
  whenUnsatisfiable: DoNotScaleUp
