# Envoy relay between the external Application Load Balancer and the internal
# multi-cluster Inference Gateway. Envoy has exactly one upstream: the private
# VIP of the internal Gateway in the config cluster's region. It has no admin
# interface, no dynamic configuration, and no service account token.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-front-door-envoy
  namespace: ${MR_FRONT_DOOR_NAMESPACE}
data:
  envoy.yaml: |
    # Bound the number of downstream connections (Envoy warns without it).
    overload_manager:
      resource_monitors:
        - name: envoy.resource_monitors.global_downstream_max_connections
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
            max_active_downstream_connections: 10000
    static_resources:
      listeners:
        - name: front_door
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: front_door
                    codec_type: AUTO
                    normalize_path: true
                    merge_slashes: true
                    # LLM responses can stream for a long time: keep idle and
                    # stream timeouts aligned with the load balancer timeouts.
                    # request_timeout is unset (disabled) so that long
                    # streaming responses aren't cut.
                    stream_idle_timeout: ${MR_FRONT_DOOR_TIMEOUT_SEC}s
                    request_headers_timeout: 30s
                    common_http_protocol_options:
                      # Longer than the external load balancer's backend
                      # keepalive timeout (600 s), as recommended.
                      idle_timeout: ${MR_FRONT_DOOR_TIMEOUT_SEC}s
                      headers_with_underscores_action: REJECT_REQUEST
                    access_log:
                      - name: envoy.access_loggers.stdout
                        filter:
                          header_filter:
                            header:
                              name: ":path"
                              string_match:
                                exact: /healthz
                              invert_match: true
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              start_time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                              protocol: "%PROTOCOL%"
                              response_code: "%RESPONSE_CODE%"
                              response_flags: "%RESPONSE_FLAGS%"
                              bytes_received: "%BYTES_RECEIVED%"
                              bytes_sent: "%BYTES_SENT%"
                              duration_ms: "%DURATION%"
                              x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
                              request_id: "%REQ(X-REQUEST-ID)%"
                              iap_user: "%REQ(X-GOOG-AUTHENTICATED-USER-EMAIL)%"
                    route_config:
                      name: front_door
                      virtual_hosts:
                        - name: all
                          domains: ["*"]
                          routes:
                            # Load balancer health check. Answered by Envoy
                            # itself, so the front door stays healthy while
                            # inference backends scale.
                            - match:
                                path: /healthz
                              direct_response:
                                status: 200
                                body:
                                  inline_string: "ok\n"
                            # Fail-closed guard: IAP adds a signed
                            # x-goog-iap-jwt-assertion header to every request
                            # it lets through. If IAP isn't enabled on the
                            # backend service (for example, the
                            # GCPBackendPolicy wasn't attached), requests
                            # don't have it and are rejected below. This is a
                            # guard against misconfiguration, not
                            # authentication: IAP is the access control.
                            - match:
                                prefix: /
                                headers:
                                  - name: x-goog-iap-jwt-assertion
                                    present_match: true
                              route:
                                cluster: internal_gateway
                                timeout: ${MR_FRONT_DOOR_TIMEOUT_SEC}s
                                idle_timeout: ${MR_FRONT_DOOR_TIMEOUT_SEC}s
                              # Don't forward IAP credentials (bearer tokens,
                              # IAP session cookies, and the IAP assertion) to
                              # the model servers.
                              request_headers_to_remove:
                                - authorization
                                - proxy-authorization
                                - cookie
                                - x-goog-iap-jwt-assertion
                            - match:
                                prefix: /
                              direct_response:
                                status: 403
                                body:
                                  inline_string: "front door: request did not pass IAP\n"
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: internal_gateway
          type: STATIC
          connect_timeout: 10s
          lb_policy: ROUND_ROBIN
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 10000
                max_pending_requests: 10000
                max_requests: 10000
                max_retries: 3
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              common_http_protocol_options:
                # Shorter than the internal load balancer's client HTTP
                # keepalive timeout (610 s), so that Envoy never reuses a
                # connection that the load balancer is closing.
                idle_timeout: 300s
              explicit_http_config:
                http_protocol_options: {}
          load_assignment:
            cluster_name: internal_gateway
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          # Private VIP of the internal multi-cluster
                          # Inference Gateway in the config cluster's region.
                          address: ${MR_FRONT_DOOR_UPSTREAM_VIP}
                          port_value: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-front-door
  namespace: ${MR_FRONT_DOOR_NAMESPACE}
  labels:
    app: llm-front-door
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-front-door
  template:
    metadata:
      labels:
        app: llm-front-door
      annotations:
        # Rolls the pods when the upstream VIP changes (for example, after the
        # internal Gateway is re-created).
        llmd-multi-region/upstream-vip: "${MR_FRONT_DOOR_UPSTREAM_VIP}"
    spec:
      serviceAccountName: llm-front-door
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: llm-front-door
      containers:
        - name: envoy
          image: ${MR_FRONT_DOOR_ENVOY_IMAGE}
          imagePullPolicy: IfNotPresent
          args:
            - --config-path
            - /etc/envoy/envoy.yaml
            - --concurrency
            - "2"
            - --disable-hot-restart
            - --log-level
            - info
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: llm-front-door-envoy
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-front-door
  namespace: ${MR_FRONT_DOOR_NAMESPACE}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: llm-front-door
---
# Only used by the external Gateway (one Service per Gateway, as recommended
# when policies differ between load balancers).
apiVersion: v1
kind: Service
metadata:
  name: llm-front-door
  namespace: ${MR_FRONT_DOOR_NAMESPACE}
  labels:
    app: llm-front-door
spec:
  type: ClusterIP
  selector:
    app: llm-front-door
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
