# Global external Application Load Balancer (single-cluster Gateway in the
# config cluster). HTTPS only: there is no port 80 listener, and TLS is
# terminated with the Google-managed certificate created by
# terraform/front_door. The address is the global static IP that the Cloud
# Endpoints host name resolves to.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-front-door
  namespace: ${MR_FRONT_DOOR_NAMESPACE}
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: ${MR_FRONT_DOOR_ADDRESS_NAME}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        options:
          networking.gke.io/pre-shared-certs: ${MR_FRONT_DOOR_CERT_NAME}
      allowedRoutes:
        namespaces:
          from: Same
---
# TLS 1.2+ with the RESTRICTED cipher profile (SSL policy created by
# terraform/front_door).
apiVersion: networking.gke.io/v1
kind: GCPGatewayPolicy
metadata:
  name: llm-front-door
  namespace: ${MR_FRONT_DOOR_NAMESPACE}
spec:
  default:
    sslPolicy: ${MR_FRONT_DOOR_SSL_POLICY_NAME}
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: llm-front-door
