# Only requests for the front door host name are routed; the load balancer
# answers anything else (for example, requests to the bare IP) with 404.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-front-door
  namespace: ${MR_FRONT_DOOR_NAMESPACE}
spec:
  parentRefs:
    - kind: Gateway
      name: llm-front-door
  hostnames:
    - ${MR_FRONT_DOOR_HOSTNAME}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: llm-front-door
          port: 8080
