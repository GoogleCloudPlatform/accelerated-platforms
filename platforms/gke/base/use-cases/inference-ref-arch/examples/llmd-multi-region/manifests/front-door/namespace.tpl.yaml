# Dedicated namespace for the optional external front door, so that it can be
# deleted (with its load balancer) without touching the inference namespace.
# The "restricted" Pod Security Standard is enforced.
apiVersion: v1
kind: Namespace
metadata:
  name: ${MR_FRONT_DOOR_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: llmd-multi-region
    app.kubernetes.io/component: front-door
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-front-door
  namespace: ${MR_FRONT_DOOR_NAMESPACE}
automountServiceAccountToken: false
