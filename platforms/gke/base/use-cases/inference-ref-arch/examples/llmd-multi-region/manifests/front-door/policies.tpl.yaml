# Load balancer health check: Envoy answers /healthz itself. Health checks
# bypass IAP.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: llm-front-door
  namespace: ${MR_FRONT_DOOR_NAMESPACE}
spec:
  targetRef:
    group: ""
    kind: Service
    name: llm-front-door
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /healthz
---
# IAP on the front door backend service: every request must carry a Google
# identity that has roles/iap.httpsResourceAccessor on this backend service
# (granted by scripts/deploy-front-door.sh). Without clientID and
# oauth2ClientSecret, IAP uses the Google-managed OAuth client (browser sign-in
# for users in the project's organization only). With MR_IAP_OAUTH_CLIENT_ID
# and MR_IAP_OAUTH_CLIENT_SECRET_FILE, the custom OAuth client is used.
#
# The optional Cloud Armor policy (source IP allowlist) is evaluated before
# IAP.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: llm-front-door
  namespace: ${MR_FRONT_DOOR_NAMESPACE}
spec:
  targetRef:
    group: ""
    kind: Service
    name: llm-front-door
  default:
    # Long-running streaming completions.
    timeoutSec: ${MR_FRONT_DOOR_TIMEOUT_SEC}
    logging:
      enabled: true
      sampleRate: 1000000
    iap:
      enabled: true
${MR_FRONT_DOOR_IAP_OAUTH_FIELDS}
${MR_FRONT_DOOR_SECURITY_POLICY_FIELD}
