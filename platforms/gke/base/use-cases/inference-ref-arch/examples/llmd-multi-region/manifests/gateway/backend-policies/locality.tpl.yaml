---
# Locality-first load balancing (default): the load balancer sends traffic to
# the region closest to the client (WATERFALL_BY_REGION) until that region's
# KV cache utilization reaches the target, then spills over to the next closest
# region. Use a high target to keep traffic (and prefix cache hits) local.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: ${MR_ROUTE_BACKEND_NAME}
  namespace: ${MR_NAMESPACE}
spec:
  targetRef:
    group: ${MR_ROUTE_BACKEND_GROUP}
    kind: ${MR_ROUTE_BACKEND_KIND}
    name: ${MR_ROUTE_BACKEND_NAME}
  default:
    timeoutSec: ${MR_BACKEND_TIMEOUT_SEC}
    logging:
      enabled: true
      sampleRate: 1000000
    balancingMode: CUSTOM_METRICS
    trafficDuration: LONG
    customMetrics:
      - name: gke.named_metrics.kv-cache
        maxUtilizationPercent: ${MR_LB_MAX_UTILIZATION_PERCENT}
        dryRun: false
