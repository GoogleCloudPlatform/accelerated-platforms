---
# Capacity-optimized load balancing around a preferred region: traffic from
# every client is sent to the preferred region (for example, the region with
# the most or cheapest accelerator capacity) until it reaches the KV cache
# utilization target, and only then spills over to other regions. Clients far
# from the preferred region trade latency for better capacity utilization.
# NOTE: GCPBackendPolicy scopes are a Preview feature.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: mc-${MR_ROUTE_BACKEND_NAME}
  namespace: ${MR_NAMESPACE}
spec:
  targetRef:
    group: ${MR_ROUTE_BACKEND_GROUP}
    kind: ${MR_ROUTE_BACKEND_KIND}
    name: ${MR_ROUTE_BACKEND_NAME}
  default:
    timeoutSec: ${MR_BACKEND_TIMEOUT_SEC}
    logging:
      enabled: true
      sampleRate: 1000000
    balancingMode: CUSTOM_METRICS
    trafficDuration: LONG
    customMetrics:
      - name: gke.named_metrics.kv-cache
        maxUtilizationPercent: ${MR_LB_MAX_UTILIZATION_PERCENT}
        dryRun: false
    scopes:
      - selector:
          gke.io/region: "${MR_LB_PREFERRED_REGION}"
        backendPreference: PREFERRED
