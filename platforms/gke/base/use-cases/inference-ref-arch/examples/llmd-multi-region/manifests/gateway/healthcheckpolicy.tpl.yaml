---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: ${MR_ROUTE_BACKEND_NAME}
  namespace: ${MR_NAMESPACE}
spec:
  targetRef:
    group: ${MR_ROUTE_BACKEND_GROUP}
    kind: ${MR_ROUTE_BACKEND_KIND}
    name: ${MR_ROUTE_BACKEND_NAME}
  default:
    checkIntervalSec: 5
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /health
        port: 8000
