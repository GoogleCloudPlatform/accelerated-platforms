---
# Routes every request to the active experiment arm. Switching arms only
# changes the backendRef:
#   - baseline:                     net.gke.io/ServiceImport vllm-baseline
#   - llm-d precise prefix cache:   networking.gke.io/GCPInferencePoolImport precise-prefix-cache-routing
#   - llm-d optimized baseline:     networking.gke.io/GCPInferencePoolImport optimized-baseline
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${MR_GATEWAY_NAME}
  namespace: ${MR_NAMESPACE}
spec:
  parentRefs:
    - kind: Gateway
      name: ${MR_GATEWAY_NAME}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ${MR_ROUTE_BACKEND_GROUP}
          kind: ${MR_ROUTE_BACKEND_KIND}
          name: ${MR_ROUTE_BACKEND_NAME}
${MR_ROUTE_BACKEND_PORT}
