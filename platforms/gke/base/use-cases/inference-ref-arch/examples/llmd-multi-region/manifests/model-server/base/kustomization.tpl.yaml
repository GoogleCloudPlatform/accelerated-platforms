---
# Model server base shared by BOTH experiment arms.
#
# It reuses the llm-d precise-prefix-cache-routing GPU vLLM model server recipe
# (pinned to an immutable llm-d commit), so that the plain vLLM baseline and
# the llm-d arm run byte-for-byte the same pod spec, image, probes, volumes,
# graceful shutdown, and resources. The arm overlays only add the arm label and
# the vLLM arguments.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/llm-d/llm-d//guides/precise-prefix-cache-routing/modelserver/gpu/vllm/gke?ref=${MR_LLMD_GIT_REF}
  - pdb.yaml

patches:
  # Pods run as the namespace service account created by the inference-ref-arch
  # online_gpu terraservice (it has Workload Identity access to the regional
  # model bucket), so the recipe's service account isn't needed.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: unused
    target:
      kind: ServiceAccount
  - path: patch-model-server.yaml
    target:
      kind: Deployment
      name: precise-prefix-cache-routing-gpu-vllm-decode
