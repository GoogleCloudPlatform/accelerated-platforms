---
# Keeps at least one serving replica per arm through voluntary disruptions (such
# as GKE node pool upgrades or node drains), and prevents the Pod snapshot
# source pod from being evicted while it uploads its checkpoint. Spot preemption
# is involuntary and is not blocked by a PodDisruptionBudget.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: model-servers
spec:
  minAvailable: 1
  selector:
    matchLabels:
      llm-d.ai/guide: precise-prefix-cache-routing
      llm-d.ai/role: decode
