---
# Arm A: plain vLLM. The pods are exposed with a ClusterIP Service that is
# exported to the fleet (ServiceExport) and load balanced by the multi-cluster
# Gateway without any inference-aware routing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${MR_NAMESPACE}
nameSuffix: -baseline

labels:
  - pairs:
      acp-mr/arm: baseline
    includeSelectors: true
    includeTemplates: true

resources:
  - ../base
  - service.yaml
  - serviceexport.yaml

patches:
  - path: patch-vllm-args.yaml
    target:
      kind: Deployment
