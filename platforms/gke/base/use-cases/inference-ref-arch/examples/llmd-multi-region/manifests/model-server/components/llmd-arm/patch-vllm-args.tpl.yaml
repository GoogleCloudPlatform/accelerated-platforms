---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: precise-prefix-cache-routing-gpu-vllm-decode
spec:
  template:
    spec:
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            - "gs://${MR_MODELS_BUCKET}/${MR_MODEL_PATH}"
            - "--served-model-name=${MR_SERVED_MODEL_NAME}"
            - "--load-format=runai_streamer"
            - "--tensor-parallel-size=${MR_TENSOR_PARALLEL_SIZE}"
            - "--max-model-len=${MR_MAX_MODEL_LEN}"
            - "--gpu-memory-utilization=${MR_GPU_MEMORY_UTILIZATION}"
            - "--block-size=64"
            - "--enable-prefix-caching"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models,/v1/completions/render,/v1/chat/completions/render"
            - "--shutdown-timeout=45"
            # Serves /v1/*/render, which the router token-producer plugin
            # calls to tokenize prompts. Without it, every render call returns
            # 404 and the router silently routes without cache information.
            - "--enable-scale-out"
