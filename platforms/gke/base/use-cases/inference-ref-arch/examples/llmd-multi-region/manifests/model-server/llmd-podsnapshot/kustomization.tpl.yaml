---
# Declarative Kustomize overlay for the llm-d arm with GKE Pod snapshots
# (MR_POD_SNAPSHOTS_ENABLED=true). Layers GKE Sandbox (gVisor), cooperative
# /proc/gvisor/checkpoint signaling, Pod-IP-free arguments, and snapshot host
# memory sizing on top of ../llmd.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../llmd

patches:
  - path: patch-podsnapshot.yaml
    target:
      kind: Deployment
      name: precise-prefix-cache-routing-gpu-vllm-decode-llmd
