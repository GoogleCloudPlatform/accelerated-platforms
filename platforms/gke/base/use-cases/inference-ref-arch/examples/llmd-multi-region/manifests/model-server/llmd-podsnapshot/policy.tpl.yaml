---
# The first llm-d model server pod that matches is checkpointed when it writes
# to /proc/gvisor/checkpoint (once vLLM is healthy, so weights are in GPU
# memory and torch.compile and CUDA graph capture are done). Every later
# matching pod with the same pod spec, including those added by the HPA, is
# restored from that snapshot instead of starting cold.
apiVersion: podsnapshot.gke.io/v1
kind: PodSnapshotPolicy
metadata:
  name: llmd-model-servers
  namespace: ${MR_NAMESPACE}
spec:
  selector:
    matchLabels:
      acp-mr/arm: llmd
      llm-d.ai/role: decode
  storageConfigName: ${MR_NAMESPACE}-model-servers
  triggerConfig:
    type: workload
    postCheckpoint: resume
  snapshotScope: whole-pod
