---
# Arm B: llm-d. The pods are selected by the llm-d router InferencePools
# (precise-prefix-cache-routing and optimized-baseline), which are exported to
# the fleet and load balanced by the multi-cluster Inference Gateway. Each
# region's endpoint picker (EPP) then picks the pod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${MR_NAMESPACE}
nameSuffix: -llmd

labels:
  - pairs:
      acp-mr/arm: llmd
    includeSelectors: true
    includeTemplates: true

resources:
  - ../base

patches:
  - path: patch-vllm-args.yaml
    target:
      kind: Deployment
