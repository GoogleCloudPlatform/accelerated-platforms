# Keeps at least one llm-d model server through voluntary disruptions (for
# example, compute class active migration), so that the snapshot source pod
# isn't evicted while it uploads its checkpoint. Spot preemption isn't
# voluntary and isn't blocked.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llmd-model-servers
  namespace: ${MR_NAMESPACE}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      acp-mr/arm: llmd
      llm-d.ai/role: decode
