# Where GKE stores the Pod snapshots of this cluster: the regional bucket that
# the online_gpu terraservice creates when ira_online_gpu_pod_snapshots_enabled
# is true (hierarchical namespace, no soft delete). Cluster-scoped. The pod's
# Kubernetes service account writes and reads the snapshots (Workload Identity).
apiVersion: podsnapshot.gke.io/v1
kind: PodSnapshotStorageConfig
metadata:
  name: ${MR_NAMESPACE}-model-servers
spec:
  snapshotStorageConfig:
    gcs:
      bucket: ${MR_POD_SNAPSHOTS_BUCKET}
