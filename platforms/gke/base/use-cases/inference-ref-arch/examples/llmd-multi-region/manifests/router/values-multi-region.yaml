---
# Overrides layered on top of the pinned upstream llm-d router values
# (recipes/router/base.values.yaml, features/monitoring-gke.values.yaml, and the
# guide values) for every regional router release.

# Renders the GKE HealthCheckPolicy and GCPBackendPolicy for the InferencePool.
# They only apply to single-cluster Gateways; the multi-cluster Gateway uses the
# policies attached to the GCPInferencePoolImport in the config cluster.
provider:
  name: gke

# The multi-cluster HTTPRoute lives in the config cluster and references the
# GCPInferencePoolImport, so don't create a per-cluster HTTPRoute.
httpRoute:
  create: false

router:
  # Upstream llm-d-router-standalone v1.0.0 runs a single EPP replica (sidecar
  # Envoy + EPP) per release so ZMQ KV-cache block events stay in one unified
  # index per region. Mark the router pod unsafe to evict so the cluster
  # autoscaler never consolidates the node hosting a region's active router.
  epp:
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    # The token-producer plugin renders prompts on the vLLM pods, so the router
    # doesn't need a Hugging Face token in the cluster.
    env: []

  # Both router releases (precise-prefix-cache-routing and optimized-baseline)
  # select the same llm-d arm model server pods, so the multi-cluster HTTPRoute
  # can switch between routing strategies without redeploying model servers.
  modelServers:
    matchLabels:
      llm-d.ai/guide: precise-prefix-cache-routing
      llm-d.ai/role: decode
      acp-mr/arm: llmd
