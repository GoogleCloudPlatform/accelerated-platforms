---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-perf-config
  namespace: <environment_name>-online-gpu
data:
  config.yaml: |
    load:
      type: constant
      interval: 1.0
      sweep:
        type: linear
        timeout: 900
        num_stages: 7
        stage_duration: 120
      num_workers: 20
      worker_max_concurrency: 15
      worker_max_tcp_connections: 2500
    api:
      type: completion
      streaming: true
    server:
      type: vllm
      model_name: /gcs/google/gemma-4-31b-it
      base_url: http://vllm-rtx-pro-6000-gemma-4-31b-it-sd-ngram.<environment_name>-online-gpu.svc.cluster.local:8000
      ignore_eos: true
    tokenizer:
      pretrained_model_name_or_path: google/gemma-2-9b-it
    data:
      type: cnn_dailymail
    metrics:
      type: prometheus
      prometheus:
          scrape_interval: 15
          google_managed: true         # Whether using Google Managed Prometheus
          filters: []
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: true
      prometheus:
        summary: true
        per_stage: true
    storage:
      google_cloud_storage:
        bucket_name: <environment_name>-bench-results   # Required GCS bucket
        report_file_prefix: null          # Optional filename prefix

