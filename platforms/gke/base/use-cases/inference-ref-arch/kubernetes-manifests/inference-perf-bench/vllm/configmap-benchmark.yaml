---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-perf-config
  namespace: acp-uc1-a-online-gpu
data:
  config.yaml: |
    load:
      type: constant
      interval: 1.0
      sweep:
        type: linear
        timeout: 250
        num_stages: 7
        stage_duration: 30
      num_workers: 20
      worker_max_concurrency: 15
      worker_max_tcp_connections: 2500
    api: 
      type: completion
      streaming: true
    server:
      type: vllm
      model_name: google/gemma-3-27b-it
      base_url: http://vllm-rtx-pro-6000-gemma-3-27b-it.acp-uc1-a-online-gpu.svc.cluster.local:8000
      ignore_eos: true
    tokenizer:
      pretrained_model_name_or_path: google/gemma-3-27b-it
    data:
      type: shareGPT
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: true
    storage:
      google_cloud_storage:               
        bucket_name: acp-uc1-a-bench-results   # Required GCS bucket
        report_file_prefix: null          # Optional filename prefix
        
