---
# Schedules every model server Deployment (metadata label
# `app.kubernetes.io/component: model-server`) on one NVIDIA RTX PRO 6000
# (96 GB GDDR7) through the `gpu-rtx-pro-6000-96gb-x1` ComputeClass. CPU-only
# Deployments, such as an NVIDIA Dynamo frontend, are not selected.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: patch-accelerator.yaml
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=model-server
