---
# Drains in-flight requests before a serving Pod stops (Spot preemption,
# rolling update, scale-in, or node upgrade):
#   1. Kubernetes removes the Pod from Service endpoints and load balancer NEGs
#      while the `preStop` hook sleeps for 15s, so no new requests arrive.
#   2. The serving process then receives SIGTERM and finishes streaming its
#      in-flight responses.
#   3. Kubernetes sends SIGKILL only after terminationGracePeriodSeconds (75s),
#      leaving the server up to 60s to drain after the preStop delay.
# The hook is added to the first container of every Deployment, which is the
# serving container in each engine base.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: patch-graceful-shutdown.yaml
    target:
      kind: Deployment
