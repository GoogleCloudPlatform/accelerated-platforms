---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diffusers
  namespace: replaced-by-kustomize
spec:
  template:
    spec:
      containers:
        # The gcsfuse file cache is disabled for the fractional GPU overlays
        # (patch-gcsfuse.yaml), so the kernel page cache that this container
        # fills is the only warm copy of the model weights. Page cache is
        # charged to the container that reads a file first, so a memory limit
        # here makes the kernel drop the weights as fast as they are read, and
        # the inference server then loads them from Cloud Storage on demand.
        - name: fetch-safetensors
          resources:
            limits:
              memory: null
