---
# One NVIDIA Dynamo + TensorRT-LLM deployment: a 3-member etcd cluster for
# discovery, the OpenAI-compatible frontend, and an aggregated worker built from
# ../worker/template. Every mode overlay (kv-routing, host-offloading,
# disaggregated-pd) starts from this base and adds Components from
# ../components.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../components/graceful-shutdown

configMapGenerator:
  - envs:
      - dynamo-trtllm.env
    name: dynamo-trtllm
    namespace: replaced-by-kustomize
  - files:
      - extra-llm-api-config.yaml
      - extra-llm-api-config-decode.yaml
      - extra-llm-api-config-prefill.yaml
    name: trtllm-extra-config
    namespace: replaced-by-kustomize

configurations:
  - kustomizeconfig.yaml

resources:
  - ../../base
  - ../worker/aggregated
  - deployment-frontend.yaml
  - pod-disruption-budget.yaml
  - pod-monitoring.yaml
  - service-etcd-headless.yaml
  - service-etcd.yaml
  - service-frontend.yaml
  - statefulset-etcd.yaml
