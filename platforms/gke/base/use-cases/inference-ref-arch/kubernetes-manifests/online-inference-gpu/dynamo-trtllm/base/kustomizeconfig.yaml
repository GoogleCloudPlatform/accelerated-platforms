---
# Treats container environment variable values that name a Service or the etcd
# StatefulSet (ETCD_SERVICE_NAME, ETCD_HEADLESS_SERVICE_NAME,
# ETCD_STATEFULSET_NAME) as name references, so they follow each overlay's
# nameSuffix.
nameReference:
  - fieldSpecs:
      - kind: Deployment
        path: spec/template/spec/containers/env/value
      - kind: StatefulSet
        path: spec/template/spec/containers/env/value
    kind: Service
    version: v1
  - fieldSpecs:
      - kind: StatefulSet
        path: spec/template/spec/containers/env/value
    group: apps
    kind: StatefulSet
    version: v1
