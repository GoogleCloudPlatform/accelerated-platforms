---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dynamo-etcd
  namespace: replaced-by-kustomize
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: dynamo-etcd
  serviceName: dynamo-etcd-headless
  template:
    metadata:
      labels:
        app: dynamo-etcd
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --name=$(POD_NAME)
            - --data-dir=/var/lib/etcd/data
            - --listen-peer-urls=http://0.0.0.0:2380
            - --listen-client-urls=http://0.0.0.0:2379
            - --initial-advertise-peer-urls=http://$(POD_NAME).$(ETCD_HEADLESS_SERVICE_NAME).$(POD_NAMESPACE).svc.cluster.local:2380
            - --advertise-client-urls=http://$(POD_NAME).$(ETCD_HEADLESS_SERVICE_NAME).$(POD_NAMESPACE).svc.cluster.local:2379
            - --initial-cluster=$(ETCD_STATEFULSET_NAME)-0=http://$(ETCD_STATEFULSET_NAME)-0.$(ETCD_HEADLESS_SERVICE_NAME).$(POD_NAMESPACE).svc.cluster.local:2380,$(ETCD_STATEFULSET_NAME)-1=http://$(ETCD_STATEFULSET_NAME)-1.$(ETCD_HEADLESS_SERVICE_NAME).$(POD_NAMESPACE).svc.cluster.local:2380,$(ETCD_STATEFULSET_NAME)-2=http://$(ETCD_STATEFULSET_NAME)-2.$(ETCD_HEADLESS_SERVICE_NAME).$(POD_NAMESPACE).svc.cluster.local:2380
            - --initial-cluster-token=$(ETCD_STATEFULSET_NAME)
            - --initial-cluster-state=new
            - --auto-compaction-mode=periodic
            - --auto-compaction-retention=1h
          command:
            - /usr/local/bin/etcd
          env:
            - name: ETCD_HEADLESS_SERVICE_NAME
              value: dynamo-etcd-headless
            - name: ETCD_STATEFULSET_NAME
              value: dynamo-etcd
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: registry.k8s.io/etcd:3.5.17-0@sha256:b4a9e4a7e1cf08844c7c4db6a19cab380fbf0aad702b8c01e578e9543671b9f9
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /health?serializable=true
              port: 2379
              scheme: HTTP
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          name: etcd
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 2379
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "500m"
              ephemeral-storage: "2Gi"
              memory: "1Gi"
            requests:
              cpu: "500m"
              ephemeral-storage: "2Gi"
              memory: "1Gi"
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: 2379
              scheme: HTTP
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /var/lib/etcd
              name: etcd-data
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: dynamo-etcd
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
