---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-trtllm
  namespace: replaced-by-kustomize
spec:
  selector:
    matchLabels:
      app: dynamo-trtllm-decode
  template:
    metadata:
      labels:
        app: dynamo-trtllm-decode
    spec:
      containers:
        - env:
            - name: DISAGGREGATION_MODE
              value: decode
            - name: EXTRA_ENGINE_ARGS
              value: /etc/trtllm/extra-llm-api-config-decode.yaml
            - name: FREE_GPU_MEMORY_FRACTION
              valueFrom:
                configMapKeyRef:
                  key: DECODE_FREE_GPU_MEMORY_FRACTION
                  name: runtime
            - name: MAX_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  key: DECODE_MAX_BATCH_SIZE
                  name: runtime
            - name: MAX_NUM_TOKENS
              valueFrom:
                configMapKeyRef:
                  key: DECODE_MAX_NUM_TOKENS
                  name: runtime
            - name: TENSOR_PARALLEL_SIZE
              valueFrom:
                configMapKeyRef:
                  key: DECODE_TENSOR_PARALLEL_SIZE
                  name: runtime
          name: inference-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dynamo-trtllm
  namespace: replaced-by-kustomize
spec:
  selector:
    matchLabels:
      app: dynamo-trtllm-decode
