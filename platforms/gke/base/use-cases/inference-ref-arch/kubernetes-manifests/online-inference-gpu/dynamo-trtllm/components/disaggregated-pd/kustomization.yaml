---
# Replaces the aggregated worker in ../../base with separate prefill (default 2
# replicas for 2P1D KV-aware prefill routing) and decode (1 replica) worker
# Deployments instantiated from ../../worker/template.
#
# List this Component before ../runtime-bindings so that runtime-bindings wires
# the prefill and decode Deployments and PodDisruptionBudgets. The aggregated
# worker and its PodDisruptionBudget are deleted by labelSelector rather than by
# name, because name targets match original resource IDs from the shared worker
# template and would match the prefill and decode copies too.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dynamo-trtllm-worker
    target:
      kind: Deployment
      labelSelector: disaggregation-mode=agg
  - patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: dynamo-trtllm-worker
    target:
      kind: PodDisruptionBudget
      labelSelector: disaggregation-mode=agg

resources:
  - prefill
  - decode
