---
# Enables NVIDIA Dynamo KV Block Manager (`--connector kvbm`) tiered KV cache
# offloading from GPU VRAM (G1) to pinned host DRAM (G2, configured by
# DYN_KVBM_CPU_CACHE_GB in the overlay's runtime.env) and exposes KVBM metrics
# on port 6880 to Google Cloud Managed Service for Prometheus.
#
# List this Component before ../runtime-bindings so that runtime-bindings sets
# the namespace and variant selector on the KVBM PodMonitoring resource.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: patch-kvbm.yaml
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=model-server

resources:
  - pod-monitoring.yaml
