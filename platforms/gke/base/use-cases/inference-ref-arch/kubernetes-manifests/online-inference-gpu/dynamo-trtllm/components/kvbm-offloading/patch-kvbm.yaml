---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
spec:
  replicas: 1
  template:
    spec:
      containers:
        - env:
            - name: DYN_CONNECTOR
              value: kvbm
            - name: DYN_KVBM_CPU_CACHE_GB
              valueFrom:
                configMapKeyRef:
                  key: DYN_KVBM_CPU_CACHE_GB
                  name: runtime
            # Bypass CU_MEMHOSTALLOC_WRITECOMBINED on virtualized x86_64 guests where
            # PAT TLB-shootdown IPIs throttle host allocation to ~0.37 MB/s
            # (https://github.com/ai-dynamo/dynamo/pull/7151). Remove once upstream
            # KVBM defaults to standard cudaMallocHost pinned memory on x86_64 VMs.
            - name: DYN_KVBM_DISABLE_WRITE_COMBINED
              value: "true"
            - name: DYN_KVBM_METRICS
              value: "true"
            - name: DYN_KVBM_METRICS_PORT
              value: "6880"
            # Avoid ZMQ port collision on 127.0.0.1:56001 with TensorRT-LLM's
            # ZmqActiveMessageWorker (https://github.com/ai-dynamo/dynamo/pull/4533,
            # https://github.com/ai-dynamo/dynamo/pull/14009). Remove once upstream
            # defaults KVBM's TensorRT-LLM connector port to a non-overlapping port.
            - name: DYN_KVBM_TRTLLM_ZMQ_PORT
              value: "20081"
          name: inference-server
          ports:
            - containerPort: 6880
              name: kvbm-metrics
