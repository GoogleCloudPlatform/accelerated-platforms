---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-pool-relay
  namespace: replaced-by-kustomize
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-pool-relay
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: dynamo-pool-relay
        app.kubernetes.io/part-of: dynamo-trtllm
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - |
              set -euo pipefail
              export ETCD_ENDPOINTS="${ETCD_ENDPOINTS_OVERRIDE:-http://${ETCD_SERVICE_NAME}:2379}"
              # Experimental upstream KV event relay (components/src/dynamo/kv_dc_relay):
              # exposes regional KV cache block-hash Cuckoo-filter snapshots over gRPC.
              exec python3 -m dynamo.kv_dc_relay \
                --dc-id "${CLUSTER_ID}" \
                --namespaces "${TARGET_DYN_NAMESPACE}" \
                --bind 0.0.0.0:5561
          command:
            - /bin/bash
            - -c
          env:
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  key: CLUSTER_ID
                  name: dynamo-trtllm
            - name: DYN_DISCOVERY_BACKEND
              value: etcd
            - name: DYN_EVENT_PLANE
              value: zmq
            - name: DYN_NAMESPACE
              value: dynamo-relay
            - name: DYN_REQUEST_PLANE
              value: tcp
            - name: DYN_SYSTEM_PORT
              value: "9091"
            - name: DYN_TCP_RESPONSE_STREAM_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DYN_TCP_RESPONSE_STREAM_PORT
              value: "5562"
            - name: ETCD_SERVICE_NAME
              value: dynamo-etcd
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
            - name: TARGET_DYN_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  key: APP_LABEL
                  name: runtime
          image: replaced-by-kustomize
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 6
            grpc:
              port: 5561
              service: dynamo.kvrelay.v1.KvEventRelay
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          name: relay
          ports:
            - containerPort: 5561
              name: grpc
            - containerPort: 5562
              name: tcp-resp
            - containerPort: 9091
              name: metrics
          readinessProbe:
            failureThreshold: 3
            grpc:
              port: 5561
              service: dynamo.kvrelay.v1.KvEventRelay
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: "4Gi"
              memory: "4Gi"
            requests:
              cpu: "1"
              ephemeral-storage: "4Gi"
              memory: "2Gi"
          startupProbe:
            failureThreshold: 60
            grpc:
              port: 5561
              service: dynamo.kvrelay.v1.KvEventRelay
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
      securityContext:
        runAsGroup: 0
        runAsUser: 1000
