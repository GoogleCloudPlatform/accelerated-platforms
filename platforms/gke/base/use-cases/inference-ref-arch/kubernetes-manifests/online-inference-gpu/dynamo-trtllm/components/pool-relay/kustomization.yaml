---
# Adds the experimental NVIDIA Dynamo KV event relay (`dynamo.kv_dc_relay`) and
# its internal gRPC Service so regional KV cache block-hash Cuckoo-filter
# snapshots are exposed on port 5561.
#
# List this Component before ../runtime-bindings so that runtime-bindings sets
# the namespace, container image, and variant selector on the relay resources.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

components:
  - ../../../components/graceful-shutdown

resources:
  - deployment.yaml
  - service.yaml
