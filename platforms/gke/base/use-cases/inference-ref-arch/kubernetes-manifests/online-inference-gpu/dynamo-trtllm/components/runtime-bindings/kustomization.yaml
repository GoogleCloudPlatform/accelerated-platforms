---
# Binds each overlay's `runtime` ConfigMap and the platform `deployment` and
# `dynamo-trtllm` ConfigMaps to the NVIDIA Dynamo + TensorRT-LLM resources.
#
# Component ordering rule in each overlay's `components:` list:
#   1. Components that add or replace resources (`../disaggregated-pd`,
#      `../pool-relay`) MUST come BEFORE this Component so
#      these replacements wire their Deployments, Services, PodDisruptionBudgets,
#      and PodMonitoring objects.
#   2. Components that remove bound fields (`../../../components/gke-pod-snapshot`,
#      which removes the Cloud Storage FUSE volume) MUST come AFTER this Component.
#
# Every workload keeps its static role label (`app: dynamo-etcd`,
# `dynamo-frontend`, `dynamo-trtllm-worker`, `dynamo-trtllm-prefill`,
# `dynamo-trtllm-decode`, `dynamo-pool-relay`) while this Component stamps
# `app.kubernetes.io/part-of: <APP_LABEL>` onto every selector and Pod template,
# isolating multiple Dynamo overlays deployed in the same namespace with a
# single `APP_LABEL` key in `runtime.env`.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

replacements:
  - source:
      fieldPath: data.APP_LABEL
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.selector.matchLabels.[app.kubernetes.io/part-of]
          - spec.template.metadata.labels.[app.kubernetes.io/part-of]
        options:
          create: true
        select:
          kind: Deployment
      - fieldPaths:
          - spec.selector.matchLabels.[app.kubernetes.io/part-of]
          - spec.template.metadata.labels.[app.kubernetes.io/part-of]
          - spec.template.spec.topologySpreadConstraints.0.labelSelector.matchLabels.[app.kubernetes.io/part-of]
        options:
          create: true
        select:
          kind: StatefulSet
      - fieldPaths:
          - spec.selector.[app.kubernetes.io/part-of]
        options:
          create: true
        select:
          kind: Service
      - fieldPaths:
          - spec.selector.matchLabels.[app.kubernetes.io/part-of]
        options:
          create: true
        select:
          kind: PodDisruptionBudget
      - fieldPaths:
          - spec.selector.matchLabels.[app.kubernetes.io/part-of]
        options:
          create: true
        select:
          kind: PodMonitoring
  - source:
      fieldPath: data.CONTAINER_IMAGE_URL
      kind: ConfigMap
      name: dynamo-trtllm
    targets:
      - fieldPaths:
          - spec.template.spec.containers.0.image
        select:
          kind: Deployment
  - source:
      fieldPath: data.ETCD_CONTAINER_IMAGE_URL
      kind: ConfigMap
      name: dynamo-trtllm
    targets:
      - fieldPaths:
          - spec.template.spec.containers.[name=etcd].image
        select:
          kind: StatefulSet
          name: dynamo-etcd
  - source:
      fieldPath: data.INFERENCE_KUBERNETES_NAMESPACE
      kind: ConfigMap
      name: deployment
    targets:
      - fieldPaths:
          - metadata.namespace
        select:
          namespace: replaced-by-kustomize
  - source:
      fieldPath: data.INFERENCE_KUBERNETES_SERVICE_ACCOUNT
      kind: ConfigMap
      name: deployment
    targets:
      - fieldPaths:
          - spec.template.spec.serviceAccountName
        select:
          kind: Deployment
          labelSelector: app.kubernetes.io/component=model-server
  - source:
      fieldPath: data.MODEL_BUCKET_NAME
      kind: ConfigMap
      name: deployment
    targets:
      - fieldPaths:
          - spec.template.spec.volumes.[name=huggingface-hub-model-bucket].csi.volumeAttributes.bucketName
        select:
          kind: Deployment
          labelSelector: app.kubernetes.io/component=model-server
  - source:
      fieldPath: data.MODEL_GCS_DIR
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.template.spec.volumes.[name=huggingface-hub-model-bucket].csi.volumeAttributes.mountOptions
        options:
          delimiter: "only-dir:"
          index: 1
        select:
          kind: Deployment
          labelSelector: app.kubernetes.io/component=model-server
  - source:
      fieldPath: data.MODEL_NAME
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.template.metadata.labels.[ai.gke.io/model]
        select:
          kind: Deployment
          labelSelector: app.kubernetes.io/component=model-server
