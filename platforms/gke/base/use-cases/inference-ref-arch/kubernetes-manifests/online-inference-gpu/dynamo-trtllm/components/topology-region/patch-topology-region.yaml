---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-used
spec:
  template:
    spec:
      containers:
        - env:
            - name: DYN_KV_TRANSFER_DOMAIN
              value: region
            - name: DYN_KV_TRANSFER_ENFORCEMENT
              value: required
            - name: DYN_TOPOLOGY_ENABLED
              value: "true"
          name: inference-server
          volumeMounts:
            - mountPath: /etc/dynamo/topology
              name: dynamo-topology
              readOnly: true
      volumes:
        - configMap:
            items:
              - key: CLUSTER_REGION
                path: region
            name: replaced-by-kustomize
          name: dynamo-topology
