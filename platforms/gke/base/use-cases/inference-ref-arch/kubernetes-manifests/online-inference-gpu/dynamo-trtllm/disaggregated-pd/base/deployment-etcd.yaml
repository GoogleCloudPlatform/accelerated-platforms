---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-etcd
  namespace: replaced-by-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-etcd
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: dynamo-etcd
    spec:
      containers:
        - args:
            - |
              set -euo pipefail
              exec etcd \
                --name default \
                --data-dir /tmp/etcd-data \
                --listen-client-urls http://0.0.0.0:2379 \
                --advertise-client-urls "http://${ETCD_SERVICE_NAME}:2379"
          command:
            - /bin/bash
            - -c
          env:
            - name: ETCD_SERVICE_NAME
              value: dynamo-etcd
          image: replaced-by-kustomize
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /health
              port: 2379
              scheme: HTTP
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          name: etcd
          ports:
            - containerPort: 2379
              name: client
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 2379
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: "4Gi"
              memory: "2Gi"
            requests:
              cpu: "1"
              ephemeral-storage: "4Gi"
              memory: "2Gi"
          volumeMounts:
            - mountPath: /tmp/etcd-data
              name: etcd-data
      securityContext:
        runAsGroup: 0
        runAsUser: 1000
      serviceAccountName: replaced-by-kustomize
      volumes:
        - emptyDir: {}
          name: etcd-data
