---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-frontend
  namespace: replaced-by-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-frontend
  template:
    metadata:
      labels:
        app: dynamo-frontend
        app.kubernetes.io/part-of: dynamo-trtllm
    spec:
      containers:
        - args:
            - |
              set -euo pipefail
              export ETCD_ENDPOINTS="${ETCD_ENDPOINTS_OVERRIDE:-http://${ETCD_SERVICE_NAME}:2379}"
              exec python3 -m dynamo.frontend \
                --router-mode "${ROUTER_MODE}" \
                --http-host 0.0.0.0 \
                --http-port 8000
          command:
            - /bin/bash
            - -c
          env:
            - name: DYN_DISCOVERY_BACKEND
              value: etcd
            - name: DYN_EVENT_PLANE
              value: zmq
            - name: DYN_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  key: APP_LABEL
                  name: runtime
            - name: DYN_REQUEST_PLANE
              value: tcp
            - name: DYN_SERVING_LOAD_PUBLISH
              value: "true"
            - name: ETCD_SERVICE_NAME
              value: dynamo-etcd
            - name: ROUTER_MODE
              valueFrom:
                configMapKeyRef:
                  key: ROUTER_MODE
                  name: runtime
          image: replaced-by-kustomize
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /live
              port: 8000
              scheme: HTTP
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          name: frontend
          ports:
            - containerPort: 8000
              name: metrics
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "2"
              ephemeral-storage: "4Gi"
              memory: "4Gi"
            requests:
              cpu: "2"
              ephemeral-storage: "4Gi"
              memory: "4Gi"
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /live
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
      securityContext:
        runAsGroup: 0
        runAsUser: 1000
      serviceAccountName: replaced-by-kustomize
