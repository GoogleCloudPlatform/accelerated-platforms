---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-trtllm-prefill
  namespace: replaced-by-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-trtllm-prefill
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/ephemeral-storage-limit: "0"
        gke-gcsfuse/memory-limit: "0"
        gke-gcsfuse/volumes: "true"
      labels:
        ai.gke.io/model: replaced-by-kustomize
        app: dynamo-trtllm-prefill
        app.kubernetes.io/part-of: dynamo-trtllm
    spec:
      containers:
        - args:
            - |
              set -euo pipefail
              # Workaround for upstream tensorrtllm-runtime:1.6.1 library search order
              # (https://github.com/ai-dynamo/dynamo/issues/16690,
              # https://github.com/ai-dynamo/dynamo/pull/17227): append GKE's injected
              # host NVIDIA driver directory instead of setting K8s env LD_LIBRARY_PATH,
              # which would wipe the image's TensorRT-LLM, MPI, NIXL, and UCX paths.
              # Remove once upstream registers /usr/local/nvidia/lib64 in ld.so.conf.d.
              export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+${LD_LIBRARY_PATH}:}/usr/local/nvidia/lib64"
              export ETCD_ENDPOINTS="${ETCD_ENDPOINTS_OVERRIDE:-http://${ETCD_SERVICE_NAME}:2379}"
              if [ "${PREWARM_SAFETENSORS:-true}" = "true" ]; then
                t0="$(date +%s.%N)"
                echo "[dynamo-prefill] Pre-warming safetensors shards from HNS Cloud Storage into RAM-backed GCS FUSE cache..."
                find /model -maxdepth 1 -name '*.safetensors' -type f \
                  | xargs -r -P "${PREWARM_PARALLELISM:-16}" -I {} dd if="{}" of=/dev/null bs=16M status=none
                t1="$(date +%s.%N)"
                awk -v s="${t0}" -v e="${t1}" 'BEGIN { printf "[dynamo-prefill] Safetensors RAM pre-warm completed in %.2fs\n", e - s }'
              fi
              EXTRA_ARGS=()
              if [ "${PUBLISH_KV_EVENTS:-true}" = "true" ]; then
                EXTRA_ARGS+=(--publish-kv-events)
              fi
              if [ -n "${REASONING_PARSER:-}" ]; then
                EXTRA_ARGS+=(--dyn-reasoning-parser "${REASONING_PARSER}")
              fi
              if [ -n "${TOOL_PARSER:-}" ]; then
                EXTRA_ARGS+=(--dyn-tool-call-parser "${TOOL_PARSER}")
              fi
              exec python3 -m dynamo.trtllm \
                --model /model \
                --served-model-name "${MODEL_ID}" \
                --tensor-parallel-size "${PREFILL_TENSOR_PARALLEL_SIZE}" \
                --kv-block-size "${KV_BLOCK_SIZE}" \
                --max-batch-size "${PREFILL_MAX_BATCH_SIZE}" \
                --max-num-tokens "${PREFILL_MAX_NUM_TOKENS}" \
                --max-seq-len "${MAX_SEQ_LEN}" \
                --free-gpu-memory-fraction "${PREFILL_FREE_GPU_MEMORY_FRACTION}" \
                --extra-engine-args /etc/trtllm/extra-llm-api-config-prefill.yaml \
                --disaggregation-mode prefill \
                --publish-metrics \
                "${EXTRA_ARGS[@]}"
          command:
            - /bin/bash
            - -c
          env:
            - name: DYN_DISCOVERY_BACKEND
              value: etcd
            - name: DYN_EVENT_PLANE
              value: zmq
            - name: DYN_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  key: APP_LABEL
                  name: runtime
            - name: DYN_REQUEST_PLANE
              value: tcp
            - name: DYN_SYSTEM_PORT
              value: "9090"
            - name: ETCD_SERVICE_NAME
              value: dynamo-etcd
            - name: KV_BLOCK_SIZE
              valueFrom:
                configMapKeyRef:
                  key: KV_BLOCK_SIZE
                  name: runtime
            - name: MAX_SEQ_LEN
              valueFrom:
                configMapKeyRef:
                  key: MAX_SEQ_LEN
                  name: runtime
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  key: MODEL_ID
                  name: runtime
            - name: PREFILL_FREE_GPU_MEMORY_FRACTION
              valueFrom:
                configMapKeyRef:
                  key: PREFILL_FREE_GPU_MEMORY_FRACTION
                  name: runtime
            - name: PREFILL_MAX_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  key: PREFILL_MAX_BATCH_SIZE
                  name: runtime
            - name: PREFILL_MAX_NUM_TOKENS
              valueFrom:
                configMapKeyRef:
                  key: PREFILL_MAX_NUM_TOKENS
                  name: runtime
            - name: PREFILL_TENSOR_PARALLEL_SIZE
              valueFrom:
                configMapKeyRef:
                  key: PREFILL_TENSOR_PARALLEL_SIZE
                  name: runtime
            - name: PUBLISH_KV_EVENTS
              valueFrom:
                configMapKeyRef:
                  key: PUBLISH_KV_EVENTS
                  name: runtime
            - name: REASONING_PARSER
              valueFrom:
                configMapKeyRef:
                  key: REASONING_PARSER
                  name: runtime
                  optional: true
            - name: TOOL_PARSER
              valueFrom:
                configMapKeyRef:
                  key: TOOL_PARSER
                  name: runtime
                  optional: true
            - name: TRTLLM_ENABLE_PDL
              value: "1"
          image: replaced-by-kustomize
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /live
              port: 9090
              scheme: HTTP
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          name: inference-server
          ports:
            - containerPort: 9090
              name: metrics
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 9090
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          resources: {}
          startupProbe:
            failureThreshold: 360
            httpGet:
              path: /health
              port: 9090
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /dev/shm
              name: dev-shm
            - mountPath: /etc/trtllm
              name: trtllm-config
              readOnly: true
            - mountPath: /model
              name: huggingface-hub-model-bucket
              readOnly: true
      securityContext:
        runAsGroup: 0
        runAsUser: 1000
      serviceAccountName: replaced-by-kustomize
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 16Gi
          name: dev-shm
        - configMap:
            name: trtllm-extra-config
          name: trtllm-config
        - csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: cloud-storage-bucket-name
              mountOptions: uid=1000,gid=0,metadata-cache:ttl-secs:-1,metadata-cache:stat-cache-max-size-mb:-1,metadata-cache:type-cache-max-size-mb:-1,metadata-cache:negative-ttl-secs:0,file-cache:max-size-mb:-1,file-cache:cache-file-for-range-read:true,file-cache:enable-parallel-downloads:true,implicit-dirs,file-system:kernel-list-cache-ttl-secs:-1,only-dir:replaced-by-kustomize
              skipCSIBucketAccessCheck: "true"
          name: huggingface-hub-model-bucket
        - emptyDir:
            medium: Memory
          name: gke-gcsfuse-cache
        - emptyDir:
            medium: Memory
          name: gke-gcsfuse-tmp
        - emptyDir:
            medium: Memory
          name: gke-gcsfuse-buffer
