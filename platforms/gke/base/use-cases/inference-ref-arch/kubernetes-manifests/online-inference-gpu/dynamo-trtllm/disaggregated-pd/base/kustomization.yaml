---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - envs:
      - dynamo-trtllm.env
    name: dynamo-trtllm
    namespace: replaced-by-kustomize
  - files:
      - extra-llm-api-config-prefill.yaml
      - extra-llm-api-config-decode.yaml
    name: trtllm-extra-config
    namespace: replaced-by-kustomize

resources:
  - ../../../base
  - statefulset-etcd.yaml
  - service-etcd.yaml
  - service-etcd-headless.yaml
  - deployment-frontend.yaml
  - service-frontend.yaml
  - deployment-prefill.yaml
  - deployment-decode.yaml
  - pod-monitoring.yaml
  - pod-disruption-budget.yaml
