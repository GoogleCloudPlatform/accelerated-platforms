---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Mounts the cluster's Google Cloud region (derived by configure_dynamo_trtllm.sh
# from Terraform's cluster_region) at Dynamo's default /etc/dynamo/topology/region
# path (components/src/dynamo/common/utils/topology.py) and enforces intra-region
# NIXL KV transfers between disaggregated Prefill and Decode workers.
patches:
  - path: patch-topology-region.yaml
    target:
      kind: Deployment
      name: dynamo-trtllm-(prefill|decode).*

replacements:
  - source:
      fieldPath: metadata.name
      kind: ConfigMap
      name: dynamo-trtllm
    targets:
      - fieldPaths:
          - spec.template.spec.volumes.[name=dynamo-topology].configMap.name
        select:
          kind: Deployment
          name: dynamo-trtllm-(prefill|decode).*
