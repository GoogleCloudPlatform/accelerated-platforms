---
backend: pytorch
trust_remote_code: true
enable_attention_dp: false
enable_chunked_prefill: true
disable_overlap_scheduler: false
cuda_graph_config:
  enable_padding: true
  max_batch_size: 64
kv_cache_config:
  # Nemotron-3 uses a hybrid Mamba-2 + Attention cache; CppMambaHybridCacheManager
  # (use_kv_cache_manager_v2: false) pairs with the C++ UCX cache transceiver.
  enable_block_reuse: false
  use_kv_cache_manager_v2: false
  dtype: fp8
moe_config:
  backend: TRTLLM
cache_transceiver_config:
  # C++ UCX transceiver transfers both GQA KV blocks and recurrent Mamba-2 SSM/conv states.
  backend: UCX
  transceiver_runtime: CPP
  max_tokens_in_buffer: 65536
