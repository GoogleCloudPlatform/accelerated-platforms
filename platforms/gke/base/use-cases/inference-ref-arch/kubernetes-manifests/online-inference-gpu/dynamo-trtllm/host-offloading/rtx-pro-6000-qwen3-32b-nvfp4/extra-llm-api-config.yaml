---
backend: pytorch
trust_remote_code: true
enable_chunked_prefill: true
disable_overlap_scheduler: false
cuda_graph_config:
  enable_padding: true
  max_batch_size: 64
kv_cache_config:
  enable_block_reuse: true
  dtype: fp8
  # Pinned host memory for KV blocks evicted from GPU memory: 80 GB, which
  # patch-resources.yaml budgets in the inference-server memory limit.
  host_cache_size: 80000000000
  # Offload blocks at or above the default retention priority (35) to the host
  # cache, instead of only blocks that requests mark with a higher priority.
  secondary_offload_min_priority: 35
