---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
spec:
  template:
    metadata:
      annotations:
        gke-gcsfuse/memory-limit: "42Gi"
        gke-gcsfuse/memory-request: "42Gi"
    spec:
      containers:
        - name: inference-server
          resources:
            # Qwen3-32B-FP8 is ~32.0 GiB of weights: 42Gi for
            # gke-gcsfuse-sidecar (36Gi file cache + buffers) + 80Gi for
            # inference-server (/dev/shm + runtime) = 122Gi Guaranteed QoS
            # (< 160Gi on g4-standard-48: 180 GiB machine, 176.9 GiB capacity).
            limits:
              cpu: "12"
              ephemeral-storage: "30Gi"
              memory: "80Gi"
            requests:
              cpu: "12"
              ephemeral-storage: "30Gi"
              memory: "80Gi"
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 36Gi
          name: gke-gcsfuse-cache
