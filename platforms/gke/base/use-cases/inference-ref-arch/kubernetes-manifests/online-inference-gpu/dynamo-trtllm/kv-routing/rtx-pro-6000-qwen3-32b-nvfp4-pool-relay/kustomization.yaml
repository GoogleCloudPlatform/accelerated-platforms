---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - envs:
      - runtime.env
    name: runtime
    namespace: replaced-by-kustomize

nameSuffix: -rtx6000-qwen3-32b-nvfp4

patches:
  - path: patch-nodeselector.yaml
  - path: patch-resources.yaml

replacements:
  - source:
      fieldPath: data.APP_LABEL
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.template.metadata.labels.[app.kubernetes.io/part-of]
        select:
          kind: Deployment
          name: dynamo-frontend
      - fieldPaths:
          - spec.template.metadata.labels.[app.kubernetes.io/part-of]
        select:
          kind: Deployment
          name: dynamo-trtllm-worker
      - fieldPaths:
          - spec.template.metadata.labels.[app.kubernetes.io/part-of]
        select:
          kind: Deployment
          name: dynamo-pool-relay
      - fieldPaths:
          - spec.selector.matchLabels.[app.kubernetes.io/part-of]
        select:
          kind: PodMonitoring
  - source:
      fieldPath: data.ETCD_APP_LABEL
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.selector.matchLabels.app
          - spec.template.metadata.labels.app
        select:
          kind: Deployment
          name: dynamo-etcd
      - fieldPaths:
          - spec.selector.app
        select:
          kind: Service
          name: dynamo-etcd
  - source:
      fieldPath: data.FRONTEND_APP_LABEL
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.selector.matchLabels.app
          - spec.template.metadata.labels.app
        select:
          kind: Deployment
          name: dynamo-frontend
      - fieldPaths:
          - spec.selector.app
        select:
          kind: Service
          name: dynamo-frontend
  - source:
      fieldPath: data.WORKER_APP_LABEL
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.selector.matchLabels.app
          - spec.template.metadata.labels.app
        select:
          kind: Deployment
          name: dynamo-trtllm-worker
      - fieldPaths:
          - spec.selector.matchLabels.app
        select:
          kind: PodDisruptionBudget
  - source:
      fieldPath: data.RELAY_APP_LABEL
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.selector.matchLabels.app
          - spec.template.metadata.labels.app
        select:
          kind: Deployment
          name: dynamo-pool-relay
      - fieldPaths:
          - spec.selector.app
        select:
          kind: Service
          name: dynamo-pool-relay
  - source:
      fieldPath: metadata.name
      kind: Service
      name: dynamo-etcd
    targets:
      - fieldPaths:
          - spec.template.spec.containers.[name=etcd].env.[name=ETCD_SERVICE_NAME].value
        select:
          kind: Deployment
          name: dynamo-etcd
      - fieldPaths:
          - spec.template.spec.containers.[name=frontend].env.[name=ETCD_SERVICE_NAME].value
        select:
          kind: Deployment
          name: dynamo-frontend
      - fieldPaths:
          - spec.template.spec.containers.[name=inference-server].env.[name=ETCD_SERVICE_NAME].value
        select:
          kind: Deployment
          name: dynamo-trtllm-worker
      - fieldPaths:
          - spec.template.spec.containers.[name=relay].env.[name=ETCD_SERVICE_NAME].value
        select:
          kind: Deployment
          name: dynamo-pool-relay
  - source:
      fieldPath: data.CONTAINER_IMAGE_URL
      kind: ConfigMap
      name: dynamo-trtllm
    targets:
      - fieldPaths:
          - spec.template.spec.containers.[name=etcd].image
        select:
          kind: Deployment
          name: dynamo-etcd
      - fieldPaths:
          - spec.template.spec.containers.[name=frontend].image
        select:
          kind: Deployment
          name: dynamo-frontend
      - fieldPaths:
          - spec.template.spec.containers.[name=inference-server].image
        select:
          kind: Deployment
          name: dynamo-trtllm-worker
      - fieldPaths:
          - spec.template.spec.containers.[name=relay].image
        select:
          kind: Deployment
          name: dynamo-pool-relay
  - source:
      fieldPath: data.INFERENCE_KUBERNETES_NAMESPACE
      kind: ConfigMap
      name: deployment
    targets:
      - fieldPaths:
          - metadata.namespace
        select:
          kind: ConfigMap
      - fieldPaths:
          - metadata.namespace
        select:
          kind: Deployment
      - fieldPaths:
          - metadata.namespace
        select:
          kind: Service
      - fieldPaths:
          - metadata.namespace
        select:
          kind: PodMonitoring
      - fieldPaths:
          - metadata.namespace
        select:
          kind: PodDisruptionBudget
  - source:
      fieldPath: data.INFERENCE_KUBERNETES_SERVICE_ACCOUNT
      kind: ConfigMap
      name: deployment
    targets:
      - fieldPaths:
          - spec.template.spec.serviceAccountName
        select:
          kind: Deployment
  - source:
      fieldPath: data.MODEL_BUCKET_NAME
      kind: ConfigMap
      name: deployment
    targets:
      - fieldPaths:
          - spec.template.spec.volumes.[name=huggingface-hub-model-bucket].csi.volumeAttributes.bucketName
        select:
          kind: Deployment
          name: dynamo-trtllm-worker
  - source:
      fieldPath: data.MODEL_GCS_DIR
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.template.spec.volumes.[name=huggingface-hub-model-bucket].csi.volumeAttributes.mountOptions
        options:
          delimiter: "only-dir:"
          index: 1
        select:
          kind: Deployment
          name: dynamo-trtllm-worker
  - source:
      fieldPath: data.MODEL_NAME
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.template.metadata.labels.[ai.gke.io/model]
        select:
          kind: Deployment
          name: dynamo-trtllm-worker

resources:
  - ../base
  - deployment-pool-relay.yaml
  - service-pool-relay.yaml
