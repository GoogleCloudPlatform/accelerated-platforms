---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-trtllm-worker
  namespace: replaced-by-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-trtllm-worker
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/ephemeral-storage-limit: "0"
        gke-gcsfuse/memory-limit: "0"
        gke-gcsfuse/volumes: "true"
      labels:
        ai.gke.io/model: replaced-by-kustomize
        app: dynamo-trtllm-worker
        app.kubernetes.io/part-of: dynamo-trtllm
    spec:
      containers:
        - args:
            - |
              set -euo pipefail
              # Workaround for upstream dual-NIXL packaging split in tensorrtllm-runtime:1.6.1
              # (https://github.com/ai-dynamo/dynamo/issues/16690,
              # https://github.com/ai-dynamo/dynamo/pull/17227): /opt/nvidia/nvda_nixl
              # ships native UCX/GDS plugins without libplugin_POSIX.so, whereas the
              # bundled nixl_cu13 wheel ships libplugin_POSIX.so + liburing. Remove once
              # upstream ships libplugin_POSIX.so directly in NIXL_PLUGIN_DIR.
              if [ -n "${NIXL_PLUGIN_DIR:-}" ] && [ ! -f "${NIXL_PLUGIN_DIR}/libplugin_POSIX.so" ]; then
                for d in /opt/dynamo/venv/lib/python*/site-packages/nixl_cu*.libs/nixl; do
                  if [ -f "${d}/libplugin_POSIX.so" ]; then
                    mkdir -p /tmp/nixl-plugins
                    ln -sf "${NIXL_PLUGIN_DIR}"/* /tmp/nixl-plugins/
                    ln -sf "${d}/libplugin_POSIX.so" /tmp/nixl-plugins/libplugin_POSIX.so
                    export NIXL_PLUGIN_DIR=/tmp/nixl-plugins
                    nixl_libs_dir="$(dirname "${d}")"
                    export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+${LD_LIBRARY_PATH}:}${nixl_libs_dir}"
                    break
                  fi
                done
              fi
              # Workaround for GKE host NVIDIA driver injection vs. container LD_LIBRARY_PATH
              # (https://github.com/ai-dynamo/dynamo/issues/16690): append /usr/local/nvidia/lib64
              # so TensorRT-LLM, MPI, NIXL, and /usr/local/ucx/lib retain precedence.
              # Remove once upstream registers /usr/local/nvidia/lib64 in ld.so.conf.d.
              export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+${LD_LIBRARY_PATH}:}/usr/local/nvidia/lib64"
              export ETCD_ENDPOINTS="${ETCD_ENDPOINTS_OVERRIDE:-http://${ETCD_SERVICE_NAME}:2379}"
              # Workaround for missing kvbm wheel in tensorrtllm-runtime:1.6.1 venv
              # (https://github.com/ai-dynamo/dynamo/pull/17229). Remove once upstream
              # pre-installs the kvbm wheel in /opt/dynamo/venv for non-root UIDs.
              if ! python3 -c "import kvbm" >/dev/null 2>&1; then
                echo "[dynamo-kvbm] Installing kvbm==${KVBM_VERSION:-1.6.1} into /tmp/kvbm-site..."
                mkdir -p /tmp/kvbm-site
                UV_CACHE_DIR=/tmp/uv-cache uv pip install --no-deps --target /tmp/kvbm-site "kvbm==${KVBM_VERSION:-1.6.1}"
                export PYTHONPATH="/tmp/kvbm-site${PYTHONPATH:+:${PYTHONPATH}}"
              fi
              if [ "${PREWARM_SAFETENSORS:-true}" = "true" ]; then
                t0="$(date +%s.%N)"
                echo "[dynamo-kvbm] Pre-warming safetensors shards from HNS Cloud Storage into RAM-backed GCS FUSE cache..."
                find /model -maxdepth 1 -name '*.safetensors' -type f \
                  | xargs -r -P "${PREWARM_PARALLELISM:-16}" -I {} dd if="{}" of=/dev/null bs=16M status=none
                t1="$(date +%s.%N)"
                awk -v s="${t0}" -v e="${t1}" 'BEGIN { printf "[dynamo-kvbm] Safetensors RAM pre-warm completed in %.2fs\n", e - s }'
              fi
              EXTRA_ARGS=()
              if [ -n "${REASONING_PARSER:-}" ]; then
                EXTRA_ARGS+=(--dyn-reasoning-parser "${REASONING_PARSER}")
              fi
              if [ -n "${TOOL_PARSER:-}" ]; then
                EXTRA_ARGS+=(--dyn-tool-call-parser "${TOOL_PARSER}")
              fi
              exec python3 -m dynamo.trtllm \
                --model /model \
                --served-model-name "${MODEL_ID}" \
                --tensor-parallel-size "${TENSOR_PARALLEL_SIZE}" \
                --kv-block-size "${KV_BLOCK_SIZE}" \
                --max-batch-size "${MAX_BATCH_SIZE}" \
                --max-num-tokens "${MAX_NUM_TOKENS}" \
                --max-seq-len "${MAX_SEQ_LEN}" \
                --free-gpu-memory-fraction "${FREE_GPU_MEMORY_FRACTION}" \
                --extra-engine-args /etc/trtllm/extra-llm-api-config.yaml \
                --disaggregation-mode agg \
                --connector kvbm \
                --publish-kv-events \
                --publish-metrics \
                "${EXTRA_ARGS[@]}"
          command:
            - /bin/bash
            - -c
          env:
            - name: DYN_DISCOVERY_BACKEND
              value: etcd
            - name: DYN_EVENT_PLANE
              value: zmq
            - name: DYN_KVBM_CPU_CACHE_GB
              valueFrom:
                configMapKeyRef:
                  key: DYN_KVBM_CPU_CACHE_GB
                  name: runtime
            # Bypass CU_MEMHOSTALLOC_WRITECOMBINED on virtualized x86_64 guests where
            # PAT TLB-shootdown IPIs throttle 48 GB host allocation to ~0.37 MB/s
            # (https://github.com/ai-dynamo/dynamo/pull/7151). Remove once upstream
            # KVBM defaults to standard cudaMallocHost pinned memory on x86_64 VMs.
            - name: DYN_KVBM_DISABLE_WRITE_COMBINED
              value: "true"
            - name: DYN_KVBM_METRICS
              value: "true"
            - name: DYN_KVBM_METRICS_PORT
              value: "6880"
            # Avoid ZMQ port collision on 127.0.0.1:56001 with TensorRT-LLM's
            # ZmqActiveMessageWorker (https://github.com/ai-dynamo/dynamo/pull/4533,
            # https://github.com/ai-dynamo/dynamo/pull/14009). Remove once upstream
            # defaults KVBM's TensorRT-LLM connector port to a non-overlapping port.
            - name: DYN_KVBM_TRTLLM_ZMQ_PORT
              value: "20081"
            - name: DYN_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  key: APP_LABEL
                  name: runtime
            - name: DYN_REQUEST_PLANE
              value: tcp
            - name: DYN_SYSTEM_PORT
              value: "9090"
            - name: ETCD_SERVICE_NAME
              value: dynamo-etcd
            - name: FREE_GPU_MEMORY_FRACTION
              valueFrom:
                configMapKeyRef:
                  key: FREE_GPU_MEMORY_FRACTION
                  name: runtime
            - name: KV_BLOCK_SIZE
              valueFrom:
                configMapKeyRef:
                  key: KV_BLOCK_SIZE
                  name: runtime
            - name: MAX_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  key: MAX_BATCH_SIZE
                  name: runtime
            - name: MAX_NUM_TOKENS
              valueFrom:
                configMapKeyRef:
                  key: MAX_NUM_TOKENS
                  name: runtime
            - name: MAX_SEQ_LEN
              valueFrom:
                configMapKeyRef:
                  key: MAX_SEQ_LEN
                  name: runtime
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  key: MODEL_ID
                  name: runtime
            - name: REASONING_PARSER
              valueFrom:
                configMapKeyRef:
                  key: REASONING_PARSER
                  name: runtime
                  optional: true
            - name: TENSOR_PARALLEL_SIZE
              valueFrom:
                configMapKeyRef:
                  key: TENSOR_PARALLEL_SIZE
                  name: runtime
            - name: TOOL_PARSER
              valueFrom:
                configMapKeyRef:
                  key: TOOL_PARSER
                  name: runtime
                  optional: true
            - name: TRTLLM_ENABLE_PDL
              value: "1"
          image: replaced-by-kustomize
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /live
              port: 9090
              scheme: HTTP
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          name: inference-server
          ports:
            - containerPort: 9090
              name: metrics
            - containerPort: 6880
              name: kvbm-metrics
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 9090
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          resources: {}
          startupProbe:
            failureThreshold: 360
            httpGet:
              path: /health
              port: 9090
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /dev/shm
              name: dev-shm
            - mountPath: /etc/trtllm
              name: trtllm-config
              readOnly: true
            - mountPath: /model
              name: huggingface-hub-model-bucket
              readOnly: true
      securityContext:
        runAsGroup: 0
        runAsUser: 1000
      serviceAccountName: replaced-by-kustomize
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 16Gi
          name: dev-shm
        - configMap:
            name: trtllm-extra-config
          name: trtllm-config
        - csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: cloud-storage-bucket-name
              mountOptions: uid=1000,gid=0,metadata-cache:ttl-secs:-1,metadata-cache:stat-cache-max-size-mb:-1,metadata-cache:type-cache-max-size-mb:-1,metadata-cache:negative-ttl-secs:0,file-cache:max-size-mb:-1,file-cache:cache-file-for-range-read:true,file-cache:enable-parallel-downloads:true,implicit-dirs,file-system:kernel-list-cache-ttl-secs:-1,only-dir:replaced-by-kustomize
              skipCSIBucketAccessCheck: "true"
          name: huggingface-hub-model-bucket
        - emptyDir:
            medium: Memory
          name: gke-gcsfuse-cache
        - emptyDir:
            medium: Memory
          name: gke-gcsfuse-tmp
        - emptyDir:
            medium: Memory
          name: gke-gcsfuse-buffer
