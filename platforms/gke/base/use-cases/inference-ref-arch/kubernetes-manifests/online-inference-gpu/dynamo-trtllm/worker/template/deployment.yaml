---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: model-server
  name: dynamo-trtllm
  namespace: replaced-by-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-trtllm-worker
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # The Cloud Storage FUSE sidecar writes the RAM file cache
        # (gke-gcsfuse-cache below), so the cache counts against the sidecar's
        # memory: 24Gi cache for checkpoints up to ~20 GiB + 6Gi for the
        # gcsfuse process and its tmp and buffer volumes. Overlays with larger
        # checkpoints raise both values.
        gke-gcsfuse/cpu-limit: "4"
        gke-gcsfuse/cpu-request: "4"
        gke-gcsfuse/ephemeral-storage-limit: "5Gi"
        gke-gcsfuse/ephemeral-storage-request: "5Gi"
        gke-gcsfuse/memory-limit: "30Gi"
        gke-gcsfuse/memory-request: "30Gi"
        gke-gcsfuse/volumes: "true"
      labels:
        ai.gke.io/model: replaced-by-kustomize
        app: dynamo-trtllm-worker
        app.kubernetes.io/part-of: dynamo-trtllm
    spec:
      containers:
        - args:
            - |
              set -euo pipefail
              export ETCD_ENDPOINTS="${ETCD_ENDPOINTS_OVERRIDE:-http://${ETCD_SERVICE_NAME}:2379}"
              if [ "${PREWARM_SAFETENSORS:-true}" = "true" ]; then
                t0="$(date +%s.%N)"
                echo "[dynamo-${DISAGGREGATION_MODE}] Pre-warming safetensors shards from HNS Cloud Storage into the RAM-backed Cloud Storage FUSE file cache..."
                find /model -maxdepth 1 -name '*.safetensors' -type f \
                  | xargs -r -P "${PREWARM_PARALLELISM:-16}" -I {} dd if="{}" of=/dev/null bs=16M status=none
                t1="$(date +%s.%N)"
                awk -v s="${t0}" -v e="${t1}" -v m="${DISAGGREGATION_MODE}" 'BEGIN { printf "[dynamo-%s] Safetensors RAM pre-warm completed in %.2fs\n", m, e - s }'
              fi
              EXTRA_ARGS=()
              if [ "${PUBLISH_KV_EVENTS:-true}" = "true" ]; then
                EXTRA_ARGS+=(--publish-kv-events)
              fi
              if [ -n "${DYN_CONNECTOR:-}" ]; then
                EXTRA_ARGS+=(--connector "${DYN_CONNECTOR}")
              fi
              if [ -n "${REASONING_PARSER:-}" ]; then
                EXTRA_ARGS+=(--dyn-reasoning-parser "${REASONING_PARSER}")
              fi
              if [ -n "${TOOL_PARSER:-}" ]; then
                EXTRA_ARGS+=(--dyn-tool-call-parser "${TOOL_PARSER}")
              fi
              exec python3 -m dynamo.trtllm \
                --model /model \
                --served-model-name "${MODEL_ID}" \
                --tensor-parallel-size "${TENSOR_PARALLEL_SIZE}" \
                --kv-block-size "${KV_BLOCK_SIZE}" \
                --max-batch-size "${MAX_BATCH_SIZE}" \
                --max-num-tokens "${MAX_NUM_TOKENS}" \
                --max-seq-len "${MAX_SEQ_LEN}" \
                --free-gpu-memory-fraction "${FREE_GPU_MEMORY_FRACTION}" \
                --extra-engine-args "${EXTRA_ENGINE_ARGS}" \
                --disaggregation-mode "${DISAGGREGATION_MODE}" \
                --publish-metrics \
                "${EXTRA_ARGS[@]}"
          command:
            - /bin/bash
            - -c
          env:
            - name: DISAGGREGATION_MODE
              value: agg
            - name: DYN_DISCOVERY_BACKEND
              value: etcd
            - name: DYN_EVENT_PLANE
              value: zmq
            - name: DYN_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  key: APP_LABEL
                  name: runtime
            - name: DYN_REQUEST_PLANE
              value: tcp
            - name: DYN_SYSTEM_PORT
              value: "9090"
            - name: ETCD_SERVICE_NAME
              value: dynamo-etcd
            - name: EXTRA_ENGINE_ARGS
              value: /etc/trtllm/extra-llm-api-config.yaml
            - name: FREE_GPU_MEMORY_FRACTION
              valueFrom:
                configMapKeyRef:
                  key: FREE_GPU_MEMORY_FRACTION
                  name: runtime
            - name: KV_BLOCK_SIZE
              valueFrom:
                configMapKeyRef:
                  key: KV_BLOCK_SIZE
                  name: runtime
            - name: MAX_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  key: MAX_BATCH_SIZE
                  name: runtime
            - name: MAX_NUM_TOKENS
              valueFrom:
                configMapKeyRef:
                  key: MAX_NUM_TOKENS
                  name: runtime
            - name: MAX_SEQ_LEN
              valueFrom:
                configMapKeyRef:
                  key: MAX_SEQ_LEN
                  name: runtime
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  key: MODEL_ID
                  name: runtime
            - name: PUBLISH_KV_EVENTS
              valueFrom:
                configMapKeyRef:
                  key: PUBLISH_KV_EVENTS
                  name: runtime
                  optional: true
            - name: REASONING_PARSER
              valueFrom:
                configMapKeyRef:
                  key: REASONING_PARSER
                  name: runtime
                  optional: true
            - name: TENSOR_PARALLEL_SIZE
              valueFrom:
                configMapKeyRef:
                  key: TENSOR_PARALLEL_SIZE
                  name: runtime
            - name: TOOL_PARSER
              valueFrom:
                configMapKeyRef:
                  key: TOOL_PARSER
                  name: runtime
                  optional: true
            - name: TRTLLM_ENABLE_PDL
              value: "1"
          image: replaced-by-kustomize
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /live
              port: 9090
              scheme: HTTP
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          name: inference-server
          ports:
            - containerPort: 9090
              name: metrics
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 9090
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          resources: {}
          startupProbe:
            failureThreshold: 360
            httpGet:
              path: /health
              port: 9090
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /dev/shm
              name: dev-shm
            - mountPath: /etc/trtllm
              name: trtllm-config
              readOnly: true
            - mountPath: /model
              name: huggingface-hub-model-bucket
              readOnly: true
      securityContext:
        runAsGroup: 0
        runAsUser: 1000
      serviceAccountName: replaced-by-kustomize
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 16Gi
          name: dev-shm
        - configMap:
            name: trtllm-extra-config
          name: trtllm-config
        - csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: cloud-storage-bucket-name
              mountOptions: uid=1000,gid=0,metadata-cache:ttl-secs:-1,metadata-cache:stat-cache-max-size-mb:-1,metadata-cache:type-cache-max-size-mb:-1,metadata-cache:negative-ttl-secs:0,file-cache:max-size-mb:-1,file-cache:cache-file-for-range-read:true,file-cache:enable-parallel-downloads:true,implicit-dirs,file-system:kernel-list-cache-ttl-secs:-1,only-dir:replaced-by-kustomize
              skipCSIBucketAccessCheck: "true"
          name: huggingface-hub-model-bucket
        - emptyDir:
            medium: Memory
            sizeLimit: 24Gi
          name: gke-gcsfuse-cache
        - emptyDir:
            medium: Memory
            sizeLimit: 2Gi
          name: gke-gcsfuse-tmp
        - emptyDir:
            medium: Memory
            sizeLimit: 2Gi
          name: gke-gcsfuse-buffer
