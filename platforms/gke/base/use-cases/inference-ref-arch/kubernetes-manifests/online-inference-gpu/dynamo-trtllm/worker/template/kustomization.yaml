---
# One NVIDIA Dynamo TensorRT-LLM worker (`python3 -m dynamo.trtllm`) and its
# PodDisruptionBudget. ../aggregated and the prefill and decode overlays
# of ../../components/disaggregated-pd instantiate it, each with its own
# nameSuffix, `app` label, and DISAGGREGATION_MODE.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/graceful-shutdown

resources:
  - deployment.yaml
  - pod-disruption-budget.yaml
