---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trtllm-snap
  namespace: replaced-by-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trtllm-snap
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        ai.gke.io/model: replaced-by-kustomize
        app: trtllm-snap
    spec:
      # GKE Pod snapshots run inside gVisor (runsc) and do not support CSI
      # volumes (`gcsfuse.csi.storage.gke.io` or `secrets-store.csi.k8s.io`).
      # On cold start, weights are streamed concurrently from the regional HNS
      # Cloud Storage bucket into `/model-cache` (RAM-backed `emptyDir`) via
      # Workload Identity, loaded into GPU VRAM, warmed up with a single
      # request, and deleted from `/model-cache` right before triggering
      # `/proc/gvisor/checkpoint`.
      enableServiceLinks: false
      runtimeClassName: gvisor
      serviceAccountName: replaced-by-kustomize
      containers:
        - name: inference-server
          image: replaced-by-kustomize
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail
              rm -f /tmp/trtllm-ready
              # Under gVisor nvproxy, place /usr/local/nvidia/lib64 ahead of
              # /usr/local/cuda/compat/lib* so nvproxy's host-matched libcuda.so.1
              # is used, and unset BASH_ENV so child #!/bin/bash scripts (such as
              # trtllm-llmapi-launch) do not re-prepend compat/lib.real.
              CLEAN_LD="$(printf '%s' "${LD_LIBRARY_PATH:-}" | tr ':' '\n' | grep -v '^/usr/local/cuda/compat/' | paste -sd: -)"
              export LD_LIBRARY_PATH="/usr/local/nvidia/lib64:${CLEAN_LD}:/usr/local/cuda/compat/lib"
              unset BASH_ENV

              if [ -n "${MODEL_BUCKET_NAME:-}" ]; then
                export HF_HUB_OFFLINE=1
                echo "[podsnapshot] Streaming '${MODEL_GCS_DIR}' from gs://${MODEL_BUCKET_NAME} into RAM (/model-cache)..."
                python3 /etc/trtllm/gcs_model_streamer.py
              else
                if [ -f /var/run/secrets/huggingface.co/token ]; then
                  mkdir -p /root/.cache/huggingface
                  cp /var/run/secrets/huggingface.co/token /root/.cache/huggingface/token
                fi
                echo "[podsnapshot] Downloading '${MODEL_ID}' from Hugging Face Hub into /model-cache..."
                python3 -c 'import os; from huggingface_hub import snapshot_download; snapshot_download(repo_id=os.environ["MODEL_ID"], local_dir="/model-cache", max_workers=8)'
                rm -f /root/.cache/huggingface/token /root/.cache/huggingface/hub/token
              fi

              EXTRA_ARGS=()
              if [ -n "${REASONING_PARSER:-}" ]; then
                EXTRA_ARGS+=(--reasoning_parser "${REASONING_PARSER}")
              fi
              if [ -n "${TOOL_PARSER:-}" ]; then
                EXTRA_ARGS+=(--tool_parser "${TOOL_PARSER}")
              fi

              # Always launch via `mpirun ... trtllm-llmapi-launch`, even at
              # TP=1, so TensorRT-LLM uses a pre-initialized MPI world instead
              # of OpenMPI 5.0 PRTE dynamic `MPI.COMM_SELF.Spawn()`.
              mpirun \
                --allow-run-as-root \
                --oversubscribe \
                -n "${TENSOR_PARALLEL_SIZE}" \
                trtllm-llmapi-launch \
                trtllm-serve /model-cache \
                --host 0.0.0.0 \
                --port 8000 \
                --backend pytorch \
                --served_model_name "${MODEL_ID}" \
                --tp_size "${TENSOR_PARALLEL_SIZE}" \
                --max_batch_size "${MAX_BATCH_SIZE}" \
                --max_num_tokens "${MAX_NUM_TOKENS}" \
                --max_seq_len "${MAX_SEQ_LEN}" \
                --trust_remote_code \
                --extra_llm_api_options /etc/trtllm/extra-llm-api-config.yaml \
                "${EXTRA_ARGS[@]}" &
              TRTLLM_PID=$!
              trap 'kill -TERM "${TRTLLM_PID}" 2>/dev/null || true; wait "${TRTLLM_PID}" 2>/dev/null || true' TERM INT

              if [ ! -e /proc/gvisor/checkpoint ]; then
                echo "[podsnapshot] /proc/gvisor/checkpoint is absent; skipping checkpoint trigger."
              else
                echo "[podsnapshot] Waiting for TensorRT-LLM to become healthy..."
                while ! curl --fail --silent http://127.0.0.1:8000/health >/dev/null; do
                  if ! kill -0 "${TRTLLM_PID}" 2>/dev/null; then
                    wait "${TRTLLM_PID}"
                    exit $?
                  fi
                  sleep 2
                done
                echo "[podsnapshot] Model server is healthy; sending one warm-up request to compile lazy GPU kernels..."
                WARMUP_BODY="$(python3 -c 'import json, os; print(json.dumps({"model": os.environ["MODEL_ID"], "messages": [{"role": "user", "content": "Say OK."}], "max_tokens": 8, "temperature": 0, "chat_template_kwargs": {"enable_thinking": False}}))')"
                curl --fail --silent --show-error --max-time 180 \
                  -H "Content-Type: application/json" \
                  -d "${WARMUP_BODY}" \
                  http://127.0.0.1:8000/v1/chat/completions >/dev/null

                rm -f /root/.cache/huggingface/token /root/.cache/huggingface/hub/token 2>/dev/null || true
                find /model-cache \( -name '*.safetensors' -o -name '*.bin' -o -name '*.pt' -o -name '*.lock' \) -delete
                echo "[podsnapshot] Triggering cooperative checkpoint..."
                if CHECKPOINT_ERR="$( (echo 1 > /proc/gvisor/checkpoint) 2>&1 )"; then
                  echo "[podsnapshot] Checkpoint complete (or pod restored from snapshot)."
                else
                  echo "[podsnapshot] /proc/gvisor/checkpoint write returned non-zero (${CHECKPOINT_ERR:-unknown error}); continuing to serve."
                fi
              fi
              touch /tmp/trtllm-ready
              wait "${TRTLLM_PID}"
          env:
            - name: GLOO_SOCKET_IFNAME
              value: lo
            - name: MASTER_ADDR
              value: 127.0.0.1
            - name: MAX_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  key: MAX_BATCH_SIZE
                  name: runtime
            - name: MAX_NUM_TOKENS
              valueFrom:
                configMapKeyRef:
                  key: MAX_NUM_TOKENS
                  name: runtime
            - name: MAX_SEQ_LEN
              valueFrom:
                configMapKeyRef:
                  key: MAX_SEQ_LEN
                  name: runtime
            - name: MODEL_GCS_DIR
              valueFrom:
                configMapKeyRef:
                  key: MODEL_GCS_DIR
                  name: runtime
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  key: MODEL_ID
                  name: runtime
            - name: NCCL_SOCKET_IFNAME
              value: lo
            - name: OMPI_ALLOW_RUN_AS_ROOT
              value: "1"
            - name: OMPI_ALLOW_RUN_AS_ROOT_CONFIRM
              value: "1"
            - name: OMPI_MCA_btl_tcp_if_include
              value: lo
            - name: OMPI_MCA_btl_vader_single_copy_mechanism
              value: none
            - name: OMPI_MCA_oob_tcp_if_include
              value: lo
            - name: PYTHONPATH
              value: "/etc/trtllm"
            - name: REASONING_PARSER
              valueFrom:
                configMapKeyRef:
                  key: REASONING_PARSER
                  name: runtime
                  optional: true
            - name: TENSOR_PARALLEL_SIZE
              valueFrom:
                configMapKeyRef:
                  key: TENSOR_PARALLEL_SIZE
                  name: runtime
            - name: TOOL_PARSER
              valueFrom:
                configMapKeyRef:
                  key: TOOL_PARSER
                  name: runtime
                  optional: true
            - name: TRTLLM_NO_USAGE_STATS
              value: "1"
          ports:
            - containerPort: 8000
              name: metrics
          # No livenessProbe is set because kubelet would kill the paused
          # cold-start pod during a multi-minute checkpoint upload.
          # readinessProbe requires `/tmp/trtllm-ready`, which is created only
          # after warm-up and `/proc/gvisor/checkpoint` complete, preventing
          # Service traffic from routing to a paused cold-start pod.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/trtllm-ready && curl --fail --silent --max-time 2 http://127.0.0.1:8000/health >/dev/null
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 3
          resources: {}
          startupProbe:
            failureThreshold: 1800
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 2
          volumeMounts:
            - mountPath: /dev/shm
              name: dev-shm
            - mountPath: /etc/trtllm
              name: trtllm-config
              readOnly: true
            - mountPath: /model-cache
              name: model-cache
            - mountPath: /root/.cache/huggingface
              name: hf-cache
            - mountPath: /var/run/secrets/huggingface.co
              name: hf-token
              readOnly: true
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 16Gi
          name: dev-shm
        - configMap:
            name: trtllm-extra-config
          name: trtllm-config
        - emptyDir:
            medium: Memory
            sizeLimit: 40Gi
          name: model-cache
        - emptyDir: {}
          name: hf-cache
        - name: hf-token
          secret:
            optional: true
            secretName: huggingface-token
