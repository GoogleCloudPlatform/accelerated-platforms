---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trtllm
  namespace: replaced-by-kustomize
spec:
  selector:
    matchLabels:
      app: trtllm
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/ephemeral-storage-limit: "0"
        gke-gcsfuse/memory-limit: "0"
        gke-gcsfuse/volumes: "true"
      labels:
        ai.gke.io/model: replaced-by-kustomize
        app: trtllm
    spec:
      containers:
        - args:
            - |
              set -euo pipefail
              # Append GKE's injected host NVIDIA driver libraries without
              # clobbering TensorRT-LLM's PyTorch/CUDA library paths.
              export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+${LD_LIBRARY_PATH}:}/usr/local/nvidia/lib64"
              if [ "${PREWARM_SAFETENSORS:-true}" = "true" ]; then
                t0="$(date +%s.%N)"
                echo "[trtllm-fast-start] Pre-warming safetensors shards from HNS Cloud Storage into RAM-backed GCS FUSE cache..."
                find /model -maxdepth 1 -name '*.safetensors' -type f \
                  | xargs -r -P "${PREWARM_PARALLELISM:-16}" -I {} dd if="{}" of=/dev/null bs=16M status=none
                t1="$(date +%s.%N)"
                awk -v s="${t0}" -v e="${t1}" 'BEGIN { printf "[trtllm-fast-start] Safetensors RAM pre-warm completed in %.2fs\n", e - s }'
              fi
              EXTRA_ARGS=()
              if [ -n "${REASONING_PARSER:-}" ]; then
                EXTRA_ARGS+=(--reasoning_parser "${REASONING_PARSER}")
              fi
              if [ -n "${TOOL_PARSER:-}" ]; then
                EXTRA_ARGS+=(--tool_parser "${TOOL_PARSER}")
              fi
              exec mpirun \
                --allow-run-as-root \
                --oversubscribe \
                -n "${TENSOR_PARALLEL_SIZE}" \
                trtllm-llmapi-launch \
                trtllm-serve /model \
                --host 0.0.0.0 \
                --port 8000 \
                --backend pytorch \
                --served_model_name "${MODEL_ID}" \
                --tp_size "${TENSOR_PARALLEL_SIZE}" \
                --max_batch_size "${MAX_BATCH_SIZE}" \
                --max_num_tokens "${MAX_NUM_TOKENS}" \
                --max_seq_len "${MAX_SEQ_LEN}" \
                --trust_remote_code \
                --extra_llm_api_options /etc/trtllm/extra-llm-api-config.yaml \
                "${EXTRA_ARGS[@]}"
          command:
            - /bin/bash
            - -c
          env:
            - name: MAX_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  key: MAX_BATCH_SIZE
                  name: runtime
            - name: MAX_NUM_TOKENS
              valueFrom:
                configMapKeyRef:
                  key: MAX_NUM_TOKENS
                  name: runtime
            - name: MAX_SEQ_LEN
              valueFrom:
                configMapKeyRef:
                  key: MAX_SEQ_LEN
                  name: runtime
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  key: MODEL_ID
                  name: runtime
            - name: OMPI_ALLOW_RUN_AS_ROOT
              value: "1"
            - name: OMPI_ALLOW_RUN_AS_ROOT_CONFIRM
              value: "1"
            - name: REASONING_PARSER
              valueFrom:
                configMapKeyRef:
                  key: REASONING_PARSER
                  name: runtime
                  optional: true
            - name: TENSOR_PARALLEL_SIZE
              valueFrom:
                configMapKeyRef:
                  key: TENSOR_PARALLEL_SIZE
                  name: runtime
            - name: TOOL_PARSER
              valueFrom:
                configMapKeyRef:
                  key: TOOL_PARSER
                  name: runtime
                  optional: true
          image: replaced-by-kustomize
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          name: inference-server
          ports:
            - containerPort: 8000
              name: metrics
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          resources: {}
          startupProbe:
            failureThreshold: 360
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /dev/shm
              name: dev-shm
            - mountPath: /etc/trtllm
              name: trtllm-config
              readOnly: true
            - mountPath: /model
              name: huggingface-hub-model-bucket
              readOnly: true
      serviceAccountName: replaced-by-kustomize
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 16Gi
          name: dev-shm
        - configMap:
            name: trtllm-extra-config
          name: trtllm-config
        - csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: cloud-storage-bucket-name
              mountOptions: metadata-cache:ttl-secs:-1,metadata-cache:stat-cache-max-size-mb:-1,metadata-cache:type-cache-max-size-mb:-1,metadata-cache:negative-ttl-secs:0,file-cache:max-size-mb:-1,file-cache:cache-file-for-range-read:true,file-cache:enable-parallel-downloads:true,implicit-dirs,file-system:kernel-list-cache-ttl-secs:-1,only-dir:replaced-by-kustomize
              skipCSIBucketAccessCheck: "true"
          name: huggingface-hub-model-bucket
        - emptyDir:
            medium: Memory
          name: gke-gcsfuse-cache
        - emptyDir:
            medium: Memory
          name: gke-gcsfuse-tmp
        - emptyDir:
            medium: Memory
          name: gke-gcsfuse-buffer
