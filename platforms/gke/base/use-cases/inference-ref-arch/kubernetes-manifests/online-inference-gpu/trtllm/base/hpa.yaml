---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trtllm
  namespace: replaced-by-kustomize
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trtllm
  minReplicas: 1
  maxReplicas: 4
  # Dual-metric HPA: scales out rapidly when requests queue (`waiting`), and
  # keeps scaled-out replicas active while long reasoning traces are decoding
  # (`running`), preventing premature scale-in when the queue drains into active
  # batch slots.
  metrics:
    - type: Pods
      pods:
        metric:
          name: prometheus.googleapis.com|trtllm_num_requests_waiting|gauge
        target:
          type: AverageValue
          averageValue: "4"
    - type: Pods
      pods:
        metric:
          name: prometheus.googleapis.com|trtllm_num_requests_running|gauge
        target:
          type: AverageValue
          averageValue: "16"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
