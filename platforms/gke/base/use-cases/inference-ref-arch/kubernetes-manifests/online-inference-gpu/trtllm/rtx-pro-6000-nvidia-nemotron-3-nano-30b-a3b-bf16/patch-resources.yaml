---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trtllm
  namespace: replaced-by-kustomize
spec:
  template:
    metadata:
      annotations:
        gke-gcsfuse/memory-limit: "68Gi"
        gke-gcsfuse/memory-request: "68Gi"
    spec:
      containers:
        - name: inference-server
          resources:
            # Nemotron-3-Nano-30B-A3B-BF16 is ~58.8 GiB of weights: 68Gi for
            # gke-gcsfuse-sidecar (62Gi file cache + buffers) + 84Gi for
            # inference-server = 152Gi Guaranteed QoS (< 160Gi; see base).
            limits:
              cpu: "12"
              ephemeral-storage: "30Gi"
              memory: "84Gi"
            requests:
              cpu: "12"
              ephemeral-storage: "30Gi"
              memory: "84Gi"
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 62Gi
          name: gke-gcsfuse-cache
