---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trtllm
  namespace: replaced-by-kustomize
spec:
  template:
    spec:
      containers:
        - name: inference-server
          resources:
            # Nemotron-3-Nano-30B-A3B-FP8 is ~30.4 GiB of weights; 112Gi host
            # memory covers the RAM-backed GCS FUSE cache and runtime buffers.
            limits:
              cpu: "12"
              ephemeral-storage: "30Gi"
              memory: "112Gi"
              nvidia.com/gpu: "1"
            requests:
              cpu: "12"
              ephemeral-storage: "30Gi"
              memory: "112Gi"
              nvidia.com/gpu: "1"
