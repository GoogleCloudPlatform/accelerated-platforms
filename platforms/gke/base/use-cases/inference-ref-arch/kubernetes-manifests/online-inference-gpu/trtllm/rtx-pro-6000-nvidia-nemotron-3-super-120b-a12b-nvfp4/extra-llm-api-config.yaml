---
return_perf_metrics: true
enable_iter_perf_stats: true
kv_cache_config:
  enable_block_reuse: false
  # Super-120B-A12B-NVFP4 uses ~74.8 GiB of weights on a 96 GB RTX PRO 6000;
  # 0.80 leaves ~4 GiB of headroom for CUDA graphs and activation workspace.
  free_gpu_memory_fraction: 0.80
cuda_graph_config:
  enable_padding: true
  max_batch_size: 32
