---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trtllm
  namespace: replaced-by-kustomize
spec:
  template:
    spec:
      containers:
        - name: inference-server
          resources:
            # Nemotron-3-Super-120B-A12B-NVFP4 is ~74.8 GiB of weights; 148Gi
            # fits comfortably within g4-standard-48's ~165 GiB allocatable RAM
            # while holding the RAM-backed GCS FUSE file cache.
            limits:
              cpu: "16"
              ephemeral-storage: "30Gi"
              memory: "148Gi"
              nvidia.com/gpu: "1"
            requests:
              cpu: "16"
              ephemeral-storage: "30Gi"
              memory: "148Gi"
              nvidia.com/gpu: "1"
