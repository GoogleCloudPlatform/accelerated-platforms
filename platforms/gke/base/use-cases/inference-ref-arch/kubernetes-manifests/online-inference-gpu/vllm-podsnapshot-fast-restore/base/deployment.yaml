---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-fast-restore
  namespace: replaced-by-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-fast-restore
  template:
    metadata:
      labels:
        ai.gke.io/model: replaced-by-kustomize
        app: vllm-fast-restore
    spec:
      # GKE PodSnapshots are implemented by gVisor (runsc). The pod must run in
      # a GKE Sandbox node pool, otherwise the PodSnapshot mutating webhook has
      # no sandbox to inject the checkpoint device into.
      runtimeClassName: gvisor
      serviceAccountName: replaced-by-kustomize
      containers:
        - name: inference-server
          image: replaced-by-kustomize
          command:
            - /bin/sh
            - -c
          args:
            # This wrapper implements the cooperative checkpoint trigger that
            # `triggerConfig.type: workload` requires. GKE creates the
            # PodSnapshot object and then waits: the workload decides when its
            # own memory image is worth capturing.
            - |
              (
                if [ ! -e /proc/gvisor/checkpoint ]; then
                  echo "[podsnapshot] /proc/gvisor/checkpoint is absent; skipping checkpoint trigger."
                  echo "[podsnapshot] Expected when this pod was itself restored from a snapshot, or"
                  echo "[podsnapshot] when no matching PodSnapshotPolicy with triggerConfig.type=workload exists."
                  exit 0
                fi
                echo "[podsnapshot] Waiting for the model server to become healthy..."
                while ! curl --fail --silent http://localhost:8000/health; do
                  sleep 2
                done
                echo "[podsnapshot] Model server is healthy."
                # The weights are already resident in VRAM at this point, so the
                # on-disk copy is redundant. Removing it keeps the snapshot
                # small, which directly shortens every subsequent restore.
                rm -rf /root/.cache/huggingface/* 2>/dev/null || true
                echo "[podsnapshot] Triggering the cooperative checkpoint..."
                if echo 1 > /proc/gvisor/checkpoint; then
                  echo "[podsnapshot] Checkpoint triggered successfully."
                else
                  echo "[podsnapshot] Checkpoint trigger FAILED."
                fi
              ) &
              exec python3 -m vllm.entrypoints.openai.api_server \
                --model="${MODEL_ID}" \
                --served-model-name="${MODEL_ID}" \
                --gpu-memory-utilization="${GPU_MEMORY_UTILIZATION}" \
                --max-model-len="${MAX_MODEL_LEN}" \
                --tensor-parallel-size="${TENSOR_PARALLEL_SIZE}" \
                --safetensors-load-strategy=eager \
                --port=8000
          env:
            - name: GPU_MEMORY_UTILIZATION
              valueFrom:
                configMapKeyRef:
                  key: GPU_MEMORY_UTILIZATION
                  name: runtime
            - name: MAX_MODEL_LEN
              valueFrom:
                configMapKeyRef:
                  key: MAX_MODEL_LEN
                  name: runtime
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  key: MODEL_ID
                  name: runtime
            - name: TENSOR_PARALLEL_SIZE
              valueFrom:
                configMapKeyRef:
                  key: TENSOR_PARALLEL_SIZE
                  name: runtime
            # Provisioned from Secret Manager by the inference reference
            # implementation. See the Hugging Face initialize README.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: huggingface-token
            # PyTorch's TCPStore and the NCCL bootstrap record their rendezvous
            # address inside the checkpointed process image. A restored replica
            # always receives a new pod IP, so anything other than loopback
            # leaves the restored process pointing at an address that no longer
            # exists.
            - name: VLLM_HOST_IP
              value: 127.0.0.1
          ports:
            - containerPort: 8000
              name: metrics
          readinessProbe:
            failureThreshold: 6000
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources: {}
          volumeMounts:
            - mountPath: /dev/shm
              name: dev-shm
            - mountPath: /root/.cache/huggingface
              name: hf-cache
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 10Gi
          name: dev-shm
        - emptyDir: {}
          name: hf-cache
