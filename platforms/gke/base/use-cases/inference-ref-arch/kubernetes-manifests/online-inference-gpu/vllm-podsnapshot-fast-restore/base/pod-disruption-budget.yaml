---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vllm-fast-restore
  namespace: replaced-by-kustomize
spec:
  # Uploading a snapshot takes minutes after the workload triggers it, and the
  # checkpoint fails if the Pod is evicted before the upload completes. The GPU
  # compute classes enable active migration, which drains a node to move its
  # Pods to a more preferred node configuration. Active migration and cluster
  # autoscaler scale-down do not evict Pods when that would violate a
  # PodDisruptionBudget.
  #
  # A budget is used instead of the
  # `cluster-autoscaler.kubernetes.io/safe-to-evict: "false"` annotation. On
  # GKE Autopilot that annotation requests extended run time, which is not
  # supported for Pods that target custom compute classes. A budget also leaves
  # the pod template, and therefore the snapshot, unchanged.
  maxUnavailable: 0
  selector:
    matchLabels:
      app: vllm-fast-restore
