---
apiVersion: podsnapshot.gke.io/v1
kind: PodSnapshotStorageConfig
metadata:
  name: vllm-fast-restore-snapshot-config
spec:
  snapshotStorageConfig:
    gcs:
      # Populated by kustomize from the `MODEL_BUCKET_NAME` key of the shared
      # `deployment` ConfigMap. Each snapshot lands under a prefix named after
      # its PodSnapshot, a generated UUID that is not the object's
      # `metadata.uid`, so sharing the bucket with the Hugging Face model cache
      # is safe.
      #
      # Snapshots are written with the workload's Kubernetes service account
      # (the default `podKSA` token source), which needs object read and
      # write access on this bucket.
      #
      # Snapshots are deleted by the Pod snapshot controller, which runs as the
      # GKE service agent
      # (service-PROJECT_NUMBER@container-engine-robot.iam.gserviceaccount.com).
      # That agent needs `roles/storage.objectUser` on this bucket. Without
      # it, snapshot data is never removed from Cloud Storage.
      bucket: replaced-by-kustomize
