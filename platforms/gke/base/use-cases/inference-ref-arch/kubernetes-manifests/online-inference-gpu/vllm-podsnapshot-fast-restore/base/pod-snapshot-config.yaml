---
apiVersion: podsnapshot.gke.io/v1
kind: PodSnapshotStorageConfig
metadata:
  name: vllm-fast-restore-snapshot-config
spec:
  snapshotStorageConfig:
    gcs:
      # Populated by kustomize from the `MODEL_BUCKET_NAME` key of the shared
      # `deployment` ConfigMap. Each snapshot lands under a UID-named prefix,
      # so sharing the bucket with the Hugging Face model cache is safe.
      #
      # The GKE snapshot service agent
      # (service-PROJECT_NUMBER@container-engine-robot.iam.gserviceaccount.com)
      # needs object read, write and list on this bucket. Without
      # `storage.objects.list` the snapshots are written correctly but can
      # never be garbage collected, and deleted PodSnapshot objects hang in
      # `Deleting` forever.
      bucket: replaced-by-kustomize
