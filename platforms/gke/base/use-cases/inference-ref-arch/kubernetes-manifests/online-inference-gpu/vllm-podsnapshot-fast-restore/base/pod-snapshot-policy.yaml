---
apiVersion: podsnapshot.gke.io/v1
kind: PodSnapshotPolicy
metadata:
  name: vllm-fast-restore-snapshot-policy
  namespace: replaced-by-kustomize
spec:
  # This selector is the only wiring between the policy and the Deployment.
  # It drives both halves of the lifecycle: the first pod that matches gets
  # checkpointed, and every pod scheduled afterwards is restored from the
  # resulting image. No annotation on the Deployment is required.
  selector:
    matchLabels:
      app: vllm-fast-restore
  storageConfigName: vllm-fast-restore-snapshot-config
  triggerConfig:
    # `workload` means GKE never decides on its own when to checkpoint. It
    # creates the PodSnapshot in `AwaitingCheckpoint` and blocks until the
    # container writes to `/proc/gvisor/checkpoint`. That is exactly what we
    # want: the image is only worth capturing once the weights are in VRAM and
    # the engine is compiled and warmed up.
    type: workload
    # Keep the pod serving after its memory image has been captured. With
    # `stop` the snapshot-producing pod is terminated instead.
    postCheckpoint: resume
  # Capture the whole sandbox, not just a single container.
  snapshotScope: whole-pod
