---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podsnapshotstorageconfigs.podsnapshot.gke.io
spec:
  conversion:
    strategy: None
  group: podsnapshot.gke.io
  names:
    kind: PodSnapshotStorageConfig
    listKind: PodSnapshotStorageConfigList
    plural: podsnapshotstorageconfigs
    shortNames:
      - pssc
    singular: podsnapshotstorageconfig
  scope: Cluster
  versions:
    - name: v1
      schema:
        openAPIV3Schema:
          description: PodSnapshotStorageConfig is the general storage configuration for customers to define how snapshots are stored and managed.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: PodSnapshotStorageConfigSpec defines the desired state of PodSnapshotStorageConfig.
              properties:
                snapshotStorageConfig:
                  description: SnapshotStorageConfig defines the configuration for the snapshot's underlying storage.
                  properties:
                    gcs:
                      description: GCS contains the configuration for the GCS setups
                      properties:
                        bucket:
                          description: |-
                            Bucket is the bucket name going to be used for the storing pod snapshots.
                            Example: "bucket-for-abc"
                          pattern: ^[a-z0-9._-]+$
                          type: string
                        path:
                          description: |-
                            Path is the path inside the bucket defined in the above field that
                            indicates a child directory that going to be used for storing pod
                            snapshots.
                            Example: "a/b/c", then the stored path for pod snapshots will be
                            "gs://bucket-for-abc/a/b/c"
                          type: string
                        tokenSource:
                          default: podKSA
                          description: |-
                            TokenSource determines the authentication strategy for GCS operations.
                            "podKSA" (default) utilizes the Pod's own Kubernetes Service Account (Workload Identity).
                            "federatedP4SA" utilizes the central GKE Project Service Agent to mint path-restricted, downscoped tokens on-demand.
                          enum:
                            - podKSA
                            - federatedP4SA
                          type: string
                      required:
                        - bucket
                      type: object
                  type: object
              required:
                - snapshotStorageConfig
              type: object
            status:
              description: PodSnapshotStorageConfigStatus defines the observed state of PodSnapshotStorageConfig.
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
