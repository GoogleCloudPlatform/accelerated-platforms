---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-fast-restore
  namespace: replaced-by-kustomize
spec:
  template:
    spec:
      nodeSelector:
        # The compute class matters: it pins `driverVersion: latest`, which is
        # what puts a driver >= 570 on the node. GPU checkpointing depends on
        # `gvisor-cuda-cr`, and that binary links against
        # `cuCheckpointProcessUnlock`, a symbol that only exists from R570
        # onwards.
        cloud.google.com/compute-class: gpu-h100-80gb-high-x1
