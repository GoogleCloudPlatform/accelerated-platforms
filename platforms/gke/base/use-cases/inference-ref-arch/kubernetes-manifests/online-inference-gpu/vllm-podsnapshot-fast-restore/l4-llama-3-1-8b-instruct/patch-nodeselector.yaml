---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-fast-restore
  namespace: replaced-by-kustomize
spec:
  template:
    spec:
      nodeSelector:
        # Select the node by compute class, not by
        # `cloud.google.com/gke-accelerator`. Both land you on an L4, but only
        # the compute class pins `driverVersion: latest`. The accelerator label
        # is satisfied by the default driver (535.x), and on a 535 node the
        # `cuda-checkpoint-installer` init container refuses to install
        # `gvisor-cuda-cr`, which makes every checkpoint fail later with an
        # opaque `runsc error: exit status 128`. See the troubleshooting
        # section of the PodSnapshots guide.
        cloud.google.com/compute-class: gpu-l4-24gb-s8-x1
