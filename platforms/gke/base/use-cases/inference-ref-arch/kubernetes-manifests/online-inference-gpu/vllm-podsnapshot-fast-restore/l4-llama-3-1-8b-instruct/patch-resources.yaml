---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-fast-restore
  namespace: replaced-by-kustomize
spec:
  template:
    spec:
      containers:
        - name: inference-server
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              cpu: "4"
              # A g2-standard-8 node has 32Gi of RAM in total, so this leaves
              # headroom for the kubelet and the gVisor sandbox itself.
              memory: "24Gi"
              nvidia.com/gpu: "1"
