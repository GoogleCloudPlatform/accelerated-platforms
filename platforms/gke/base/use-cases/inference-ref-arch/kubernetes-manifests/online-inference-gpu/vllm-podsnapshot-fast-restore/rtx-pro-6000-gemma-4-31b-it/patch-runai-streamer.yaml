#
# Setting MODEL_BUCKET_NAME switches the entrypoint in `../base/deployment.yaml`
# from downloading weights from the Hugging Face Hub (Path A) to streaming
# weights directly from Cloud Storage with the NVIDIA Run:ai Model Streamer
# (Path B).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-fast-restore
  namespace: replaced-by-kustomize
spec:
  template:
    spec:
      containers:
        - name: inference-server
          env:
            # The streamer reads the weights straight out of GCS, so the bucket
            # name has to be visible to the container. Staging the model into
            # this bucket is a prerequisite; see the model-download job.
            - name: MODEL_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  key: MODEL_BUCKET_NAME
                  name: deployment
