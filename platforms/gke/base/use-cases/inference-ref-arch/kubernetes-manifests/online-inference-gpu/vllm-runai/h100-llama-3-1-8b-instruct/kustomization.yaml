---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: replaced-by-kustomize

configMapGenerator:
  - envs:
      - runtime.env
    name: runtime
    namespace: replaced-by-kustomize
  # Pin the image this PodSnapshot flow was actually validated against. The
  # rest of the vllm-runai tree tracks a newer default; the checkpoint and
  # restore path is sensitive to how the engine lays out CUDA state, so bump
  # this only after re-running the validation steps in the PodSnapshots guide.
  - behavior: merge
    literals:
      - CONTAINER_IMAGE_URL=docker.io/vllm/vllm-openai:v0.19.1
    name: vllm
    namespace: replaced-by-kustomize

nameSuffix: -h100-llama-3-1-8b-instruct

patches:
  - path: patch-nodeselector.yaml
  - path: patch-resources.yaml

replacements:
  - source:
      fieldPath: data.APP_LABEL
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.selector.matchLabels.app
          - spec.template.metadata.labels.app
        select:
          kind: Deployment
      - fieldPaths:
          - spec.selector.app
        select:
          kind: Service
      - fieldPaths:
          - spec.selector.matchLabels.app
        select:
          kind: PodSnapshotPolicy
  - source:
      fieldPath: data.CONTAINER_IMAGE_URL
      kind: ConfigMap
      name: vllm
    targets:
      - fieldPaths:
          - spec.template.spec.containers.[name=inference-server].image
        select:
          kind: Deployment
  - source:
      fieldPath: data.INFERENCE_KUBERNETES_NAMESPACE
      kind: ConfigMap
      name: deployment
    targets:
      - fieldPaths:
          - metadata.namespace
        select:
          kind: ConfigMap
      - fieldPaths:
          - metadata.namespace
        select:
          kind: Deployment
      - fieldPaths:
          - metadata.namespace
        select:
          kind: Service
      - fieldPaths:
          - metadata.namespace
        select:
          kind: ServiceAccount
      - fieldPaths:
          - metadata.namespace
        select:
          kind: HorizontalPodAutoscaler
      - fieldPaths:
          - metadata.namespace
        select:
          kind: PodSnapshotPolicy
      - fieldPaths:
          - metadata.namespace
        select:
          kind: PodSnapshotStorageConfig
  - source:
      fieldPath: data.INFERENCE_KUBERNETES_SERVICE_ACCOUNT
      kind: ConfigMap
      name: deployment
    targets:
      - fieldPaths:
          - spec.template.spec.serviceAccountName
        select:
          kind: Deployment
      - fieldPaths:
          - metadata.name
        select:
          kind: ServiceAccount
  - source:
      fieldPath: data.MODEL_BUCKET_NAME
      kind: ConfigMap
      name: deployment
    targets:
      - fieldPaths:
          - spec.snapshotStorageConfig.gcs.bucket
        select:
          kind: PodSnapshotStorageConfig
  - source:
      fieldPath: metadata.name
      kind: PodSnapshotStorageConfig
      name: vllm-snapshot-config
    targets:
      - fieldPaths:
          - spec.storageConfigName
        select:
          kind: PodSnapshotPolicy
  - source:
      fieldPath: data.MODEL_NAME
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.template.metadata.labels.[ai.gke.io/model]
        select:
          kind: Deployment
  - source:
      fieldPath: data.CONTAINER_IMAGE_URL
      kind: ConfigMap
      name: vllm
    targets:
      - fieldPaths:
          - spec.template.spec.containers.[name=inference-server].image
        select:
          kind: Deployment

resources:
  - ../base
