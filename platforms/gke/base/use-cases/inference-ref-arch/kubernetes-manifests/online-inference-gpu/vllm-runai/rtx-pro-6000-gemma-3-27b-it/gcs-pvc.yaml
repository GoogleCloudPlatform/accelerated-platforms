apiVersion: v1
kind: PersistentVolume
metadata:
  name: vllm-model-pv
spec:
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: 500Gi
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeAttributes:
      mountOptions: implicit-dirs,only-dir:replace-me
    volumeHandle: cloud-storage-bucket-name
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-pvc
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: ""
  volumeName: vllm-model-pv-rtx-pro-6000-gemma-3-27b-it
