---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-rtx-pro-6000-gemma-4-31b-it-epp-hpa
  namespace: inf-faststart-online-gpu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-rtx-pro-6000-gemma-4-31b-it
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: External
      external:
        metric:
          name: prometheus.googleapis.com|inference_pool_per_pod_queue_size|gauge
        target:
          type: AverageValue
          averageValue: "6"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
