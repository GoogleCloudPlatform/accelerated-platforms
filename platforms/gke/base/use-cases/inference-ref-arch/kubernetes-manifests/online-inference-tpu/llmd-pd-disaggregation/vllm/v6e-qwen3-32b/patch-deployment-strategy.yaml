---
# TPU chips are a fixed, non-elastic pool. The default RollingUpdate strategy
# brings a new pod up before retiring the old one, but each replica here holds
# a whole 2x4 slice (8 chips). If the cluster has only enough TPU capacity for
# the running replicas -- which is the normal case on reserved or quota-capped
# capacity -- there are no chips left for the surge. The new pod sits Pending
# forever waiting on chips the old pod will not release until the new one is
# Ready. That is a deadlock, and it needs manual intervention to clear.
#
# Setting maxSurge: 0 and maxUnavailable: 1 on each role's rolloutStrategy
# retires the old replica before bringing up the new one, trading a short
# outage during rollout for a rollout that terminates without deadlocking on
# TPU capacity.
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg-tpu
  namespace: replaced-by-kustomize
spec:
  roles:
    - name: prefill
      spec:
        rolloutStrategy:
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
    - name: decode
      spec:
        rolloutStrategy:
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
