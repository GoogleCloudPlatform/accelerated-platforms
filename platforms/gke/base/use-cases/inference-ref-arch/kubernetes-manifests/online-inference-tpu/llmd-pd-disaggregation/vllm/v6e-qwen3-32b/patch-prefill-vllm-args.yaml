---
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg-tpu
spec:
  roles:
    - name: prefill
      spec:
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              containers:
                - name: modelserver
                  # docker.io/vllm/vllm-torchtpu:v0.29.0 does not bundle
                  # runai-model-streamer[gcs]; install it before starting vLLM.
                  command:
                    - /bin/bash
                    - -c
                    - 'export VLLM_HOST_IP="${POD_IP}" && pip install --no-cache-dir "runai-model-streamer[gcs]" && exec vllm serve "$@"'
                    - --
                  envFrom:
                    - configMapRef:
                        name: runtime
                  env:
                    # The upstream llm-d base injects HF_TOKEN from a Secret named
                    # llm-d-hf-token. This path loads weights from GCS with
                    # runai_streamer and never contacts the HuggingFace hub, so the
                    # token is unused -- but if the Secret is absent the pod fails
                    # with CreateContainerConfigError before the engine ever starts.
                    # Drop the variable rather than require a credential we have no
                    # use for.
                    - name: HF_TOKEN
                      $patch: delete
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          apiVersion: v1
                          fieldPath: status.podIP
                    - name: VLLM_HOST_IP
                      value: "$(POD_IP)"
                    # Bound the per-rank Run:ai CPU ring buffer (default 40 GB
                    # per process -> ~300 GiB across 8 TP workers, which exceeds
                    # the 256Gi container memory limit on ct6e-standard-8t).
                    - name: RUNAI_STREAMER_MEMORY_LIMIT
                      value: "5368709120"
                    - name: MODEL_BUCKET_NAME
                      valueFrom:
                        configMapKeyRef:
                          name: deployment
                          key: MODEL_BUCKET_NAME
                  args:
                    - "--model=gs://$(MODEL_BUCKET_NAME)/$(MODEL_ID)"
                    - "--served-model-name=$(MODEL_ID)"
                    - "--max-model-len=$(MAX_MODEL_LEN)"
                    - "--max-num-batched-tokens=8192"
                    - "--max-num-seqs=64"
                    - "--tensor-parallel-size=$(TENSOR_PARALLEL_SIZE)"
                    - "--dtype=bfloat16"
                    - "--attention-backend=CUSTOM"
                    - "--load-format=runai_streamer"
                    - '--model-loader-extra-config={"distributed":true}'
                    - "--kv-transfer-config"
                    - '{"kv_connector":"TPUConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_connector","kv_role":"kv_producer","kv_ip":"$(POD_IP)"}'
                    - "--port=8000"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--shutdown-timeout=45"
