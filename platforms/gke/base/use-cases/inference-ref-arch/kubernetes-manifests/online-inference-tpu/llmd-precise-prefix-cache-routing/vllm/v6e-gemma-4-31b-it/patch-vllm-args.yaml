---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: precise-prefix-cache-routing-tpu-v6-vllm-decode
spec:
  template:
    spec:
      containers:
        - name: modelserver
          # docker.io/vllm/vllm-torchtpu:v0.29.0 does not bundle
          # runai-model-streamer[gcs]; install it before starting vLLM.
          command:
            - /bin/bash
            - -c
            - 'pip install --no-cache-dir "runai-model-streamer[gcs]" && exec vllm serve "$@"'
            - --
          envFrom:
            - configMapRef:
                name: runtime
          env:
            # Bound the per-rank Run:ai CPU ring buffer (default 40 GB per
            # process -> ~300 GiB across 8 TP workers, which exceeds the 256Gi
            # container memory limit on ct6e-standard-8t).
            - name: RUNAI_STREAMER_MEMORY_LIMIT
              value: "5368709120"
            - name: MODEL_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: deployment
                  key: MODEL_BUCKET_NAME
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
                  optional: true
          args:
            - "--model=gs://$(MODEL_BUCKET_NAME)/$(MODEL_ID)"
            - "--port=8000"
            - "--tensor-parallel-size=$(TENSOR_PARALLEL_SIZE)"
            - "--block-size=256"
            - "--max-model-len=$(MAX_MODEL_LEN)"
            - "--gpu-memory-utilization=$(GPU_MEMORY_UTILIZATION)"
            - "--attention-backend=CUSTOM"
            - "--enable-prefix-caching"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models,/v1/completions/render,/v1/chat/completions/render"
            - "--kv-events-config"
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","replay_endpoint":"$(KV_EVENTS_REPLAY_ENDPOINT)","topic":"kv@$(POD_IP):$(POD_PORT)@$(MODEL_ID)"}'
            - "--served-model-name=$(MODEL_ID)"
            - "--load-format=runai_streamer"
            - '--model-loader-extra-config={"distributed":true}'
            - "--max-num-batched-tokens=$(MAX_NUM_BATCHED_TOKENS)" # This is needed to avoid the error  ValueError: Chunked MM input disabled but max_tokens_per_mm_item (2496) is larger than max_num_batched_tokens (2048). Please increase max_num_batched_tokens.
            - "--shutdown-timeout=45"
