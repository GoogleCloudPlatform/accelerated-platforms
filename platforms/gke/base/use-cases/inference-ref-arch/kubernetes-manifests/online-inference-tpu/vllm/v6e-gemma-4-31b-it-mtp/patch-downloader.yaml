---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: replaced-by-kustomize
spec:
  template:
    spec:
      volumes:
        - name: huggingface-hub-drafter-model-bucket
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: cloud-storage-bucket-name
              mountOptions: metadata-cache:ttl-secs:-1,metadata-cache:stat-cache-max-size-mb:-1,metadata-cache:type-cache-max-size-mb:-1,metadata-cache:negative-ttl-secs:0,file-cache:max-size-mb:-1,file-cache:cache-file-for-range-read:true,file-cache:enable-parallel-downloads:true,implicit-dirs,file-system:kernel-list-cache-ttl-secs:-1,only-dir:replaced-by-kustomize
              skipCSIBucketAccessCheck: "true"
      containers:
        - name: fetch-safetensors
          env:
            - name: DRAFTER_MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: runtime
                  key: DRAFTER_MODEL_ID
          volumeMounts:
            - mountPath: /gcs-drafter
              name: huggingface-hub-drafter-model-bucket
              readOnly: true
          args:
            - |
              echo "########### $(date) - Starting parallel-fetch-safetensors for main model: ${MODEL_ID} and drafter model: ${DRAFTER_MODEL_ID}"
              ls -alR /gcs
              ls -alR /gcs-drafter
              find /gcs/${MODEL_ID}/*safetensors -type f | xargs -I {} -P 15 sh -c 'echo "########### $(date) - Fetching Main: {}"; dd if={} of=/dev/null'
              find /gcs-drafter/${DRAFTER_MODEL_ID}/*safetensors -type f | xargs -I {} -P 15 sh -c 'echo "########### $(date) - Fetching Drafter: {}"; dd if={} of=/dev/null'
              echo "########### $(date) - Finished parallel-fetch-safetensors"
              sleep infinity
        - name: inference-server
          env:
            - name: DRAFTER_MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: runtime
                  key: DRAFTER_MODEL_ID
          volumeMounts:
            - mountPath: /gcs-drafter
              name: huggingface-hub-drafter-model-bucket
              readOnly: true
