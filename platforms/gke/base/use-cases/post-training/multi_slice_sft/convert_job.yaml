apiVersion: batch/v1
kind: Job
metadata:
  name: convert-qwen3-14b-base-v023
  namespace: rl-kr-single-grpo-single-host
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: rl-kr-single-grpo-single-host-sa
      tolerations:
      - operator: "Exists"
      containers:
      - name: converter
        image: us-docker.pkg.dev/cloud-tpu-images/maxtext-images/tpu_post_training:0.2.3
        command:
        - /bin/bash
        - -c
        args:
        - |
          set -ex

          BASE_CONFIG_PATH=$(python3 -c "from maxtext.utils.globals import MAXTEXT_PKG_DIR; print(f'{MAXTEXT_PKG_DIR}/configs/base.yml')")

          echo "Starting Official MaxText v0.2.3 Base Model Conversion for Qwen/Qwen3-14B..."

          python3 -m maxtext.checkpoint_conversion.to_maxtext \
            ${BASE_CONFIG_PATH} \
            model_name=qwen3-14b \
            hf_access_token=${HF_TOKEN} \
            base_output_directory=gs://accelerated-platforms-dev-rl-kr-single-hf-hub-models/qwen3_14b_fresh_v023/ \
            scan_layers=True \
            use_multimodal=False \
            skip_jax_distributed_system=True \
            checkpoint_storage_use_zarr3=0 \
            checkpoint_storage_use_ocdbt=0 \
            hardware=cpu

          echo "Qwen/Qwen3-14B Base Checkpoint conversion complete!"
        env:
        - name: JAX_PLATFORMS
          value: "cpu"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: hf-secret
        resources:
          limits:
            cpu: "32"
            memory: 120Gi
          requests:
            cpu: "16"
            memory: 64Gi
        volumeMounts:
        - mountPath: /root/.cache
          name: ephemeral-cache
        - mountPath: /tmp
          name: tmp-cache
      volumes:
      - name: ephemeral-cache
        emptyDir:
          sizeLimit: 150Gi
      - name: tmp-cache
        emptyDir:
          sizeLimit: 50Gi
      restartPolicy: Never
