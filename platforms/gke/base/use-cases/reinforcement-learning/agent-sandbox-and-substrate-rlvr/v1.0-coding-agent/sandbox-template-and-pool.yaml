# ==============================================================================
# GKE Agent Sandbox: SandboxTemplate & SandboxWarmPool (v0.1.0)
# ==============================================================================
# Defines a gVisor-isolated Python runtime template (`runtimeClassName: gvisor`)
# and maintains a pre-warmed pool of 6 ready-to-claim pods so that multi-rollout
# RLVR turns (N=2 rollouts + zero-trust probe) never exhaust the pool and always
# achieve sub-second (~450-500ms) claim latency instead of 18s cold starts.
# ==============================================================================
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: python-runtime-template
  namespace: agent-sandbox
spec:
  podTemplate:
    spec:
      # Enforces Google's gVisor (runsc) user-space kernel to intercept syscalls
      runtimeClassName: gvisor
      containers:
      - name: python-runtime
        image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/python-runtime-sandbox:latest-main
        ports:
        - containerPort: 8888
        readinessProbe:
          httpGet:
            path: /
            port: 8888
          initialDelaySeconds: 1
          periodSeconds: 2
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
---
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxWarmPool
metadata:
  name: python-sandbox-warmpool
  namespace: agent-sandbox
spec:
  # Keeps 6 pre-warmed gVisor pods standing by so concurrent RL rollouts never wait on cold pod creation (18s)
  replicas: 6
  sandboxTemplateRef:
    name: python-runtime-template
