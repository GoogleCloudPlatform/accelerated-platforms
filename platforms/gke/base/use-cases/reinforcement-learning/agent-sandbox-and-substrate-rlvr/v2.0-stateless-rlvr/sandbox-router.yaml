# ==============================================================================
# Authenticated Sandbox Router Service & Deployment (`sandbox-router`)
# ==============================================================================
# Receives HTTP `/execute` requests from the ADK Agent (`default` namespace),
# verifies the `Authorization: Bearer <ROUTER_AUTH_TOKEN>` header against the
# `sandbox-router-secret` Kubernetes Secret using constant-time digest comparison,
# strips the `Authorization` header, and proxies the request to the claimed
# gVisor sandbox pod identified by `X-Sandbox-ID`.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: sandbox-router-svc
  namespace: agent-sandbox
spec:
  selector:
    app: sandbox-router
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router-deployment
  namespace: agent-sandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sandbox-router
  template:
    metadata:
      labels:
        app: sandbox-router
    spec:
      containers:
      - name: router
        image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandbox-router:latest-main
        env:
        # Enforces Bearer token verification (never use ALLOW_UNAUTHENTICATED_ROUTER="true" in production)
        - name: ROUTER_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: sandbox-router-secret
              key: ROUTER_AUTH_TOKEN
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
