---
apiVersion: v1
kind: ConfigMap
metadata:
  name: maxtext-checkpoint-converter-scripts
  namespace: replaced-by-kustomize
data:
  convert.sh: |
    #!/usr/bin/env bash
    set -ex

    BASE_CONFIG_PATH=$(python3 -c "from maxtext.utils.globals import MAXTEXT_PKG_DIR; print(f'{MAXTEXT_PKG_DIR}/configs/base.yml')")

    echo "Starting Hugging Face ${MODEL_NAME} to MaxText Checkpoint Conversion..."

    # If HF_TOKEN is not set, try to read from the mounted secret volume
    if [[ -z "${HF_TOKEN:-}" ]]; then
      TOKEN_PATH="/var/run/secrets/huggingface.co/token"
      if [[ -f "${TOKEN_PATH}" ]]; then
        export HF_TOKEN=$(cat "${TOKEN_PATH}")
        echo "Loaded HF_TOKEN from mounted secret provider volume."
      else
        echo "WARNING: HF_TOKEN is not set and no mounted token file was found at ${TOKEN_PATH}."
      fi
    fi

    python3 -m maxtext.checkpoint_conversion.to_maxtext \
      ${BASE_CONFIG_PATH} \
      model_name=${HF_MODEL_NAME} \
      hf_access_token=${HF_TOKEN} \
      base_output_directory=${BASE_OUTPUT_DIRECTORY}/${HF_MODEL_NAME} \
      scan_layers=${SCAN_LAYERS:-"True"} \
      use_multimodal=${USE_MULTIMODAL:-"False"} \
      skip_jax_distributed_system=${SKIP_JAX_DISTRIBUTED_SYSTEM:-"true"} \
      checkpoint_storage_use_zarr3=$((1 - ${USE_PATHWAYS:-0})) \
      checkpoint_storage_use_ocdbt=$((1 - ${USE_PATHWAYS:-0})) \
      hardware=cpu

    echo "Checkpoint conversion complete!"
