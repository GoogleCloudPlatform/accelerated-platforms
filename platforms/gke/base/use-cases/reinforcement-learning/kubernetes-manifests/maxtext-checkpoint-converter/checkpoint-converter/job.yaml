---
apiVersion: batch/v1
kind: Job
metadata:
  name: maxtext-checkpoint-converter
  namespace: replaced-by-kustomize
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: maxtext-checkpoint-converter
    spec:
      restartPolicy: OnFailure
      serviceAccountName: replaced-by-kustomize
      nodeSelector:
        cloud.google.com/compute-class: model-converter
      containers:
        - name: converter
          image: replaced-by-kustomize
          command:
            - /bin/bash
            - -c
          args:
            - /scripts/convert.sh
          resources:
            requests:
              cpu: "16"
              memory: "96Gi"
              ephemeral-storage: "100Gi"
            limits:
              cpu: "32"
              memory: "160Gi"
              ephemeral-storage: "250Gi"
          envFrom:
            - configMapRef:
                name: converter-config
          volumeMounts:
            - mountPath: /scripts
              name: scripts
            - mountPath: /var/run/secrets/huggingface.co
              name: huggingface-token
            - mountPath: /root/.cache
              name: ephemeral-cache
            - mountPath: /tmp
              name: tmp-cache
      volumes:
        - configMap:
            defaultMode: 0744
            name: maxtext-checkpoint-converter-scripts
          name: scripts
        - csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: huggingface-token-read
          name: huggingface-token
        - name: ephemeral-cache
          emptyDir:
            sizeLimit: 150Gi
        - name: tmp-cache
          emptyDir:
            sizeLimit: 50Gi
