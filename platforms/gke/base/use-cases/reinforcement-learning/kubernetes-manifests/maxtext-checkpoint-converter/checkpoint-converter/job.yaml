---
apiVersion: batch/v1
kind: Job
metadata:
  name: maxtext-checkpoint-converter
  namespace: replaced-by-kustomize
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: maxtext-checkpoint-converter
    spec:
      restartPolicy: OnFailure
      serviceAccountName: replaced-by-kustomize
      containers:
        - name: converter
          image: replaced-by-kustomize
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              ephemeral-storage: "40Gi"
            limits:
              cpu: "8"
              memory: "32Gi"
              ephemeral-storage: "80Gi"
          env:
            - name: MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  key: MODEL_NAME
                  name: converter-config
            - name: BASE_OUTPUT_DIRECTORY
              valueFrom:
                configMapKeyRef:
                  key: BASE_OUTPUT_DIRECTORY
                  name: converter-config
            - name: HF_MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  key: HF_MODEL_PATH
                  name: converter-config
          volumeMounts:
            - mountPath: /var/run/secrets/huggingface.co
              name: huggingface-token
      volumes:
        - csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: huggingface-token-read
          name: huggingface-token
