---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: "-v5e-4x4-llama-3-1-8b-instruct"

patches:
  - patch: |
      - op: replace
        path: /spec/workers/0/type
        value: ct5lp-hightpu-8t
      - op: replace
        path: /spec/workers/0/topology
        value: 4x4
    target:
      kind: PathwaysJob
      name: reinforcement-learning-maxtext-grpo

replacements:
  - source:
      fieldPath: data.CONTAINER_IMAGE_URL
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.controller.template.spec.containers.[name=grpo-trainer].image
        select:
          kind: PathwaysJob
  - source:
      fieldPath: data.INFERENCE_KUBERNETES_NAMESPACE
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - metadata.namespace
        select:
          kind: PathwaysJob
  - source:
      fieldPath: data.INFERENCE_KUBERNETES_SERVICE_ACCOUNT
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.controller.template.spec.serviceAccountName
        select:
          kind: PathwaysJob
  - source:
      fieldPath: data.PATHWAYS_DIR
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.pathwaysDir
          - spec.controller.template.spec.containers.[name=grpo-trainer].env.[name=GCS_OUTPUT_PATH].value
        select:
          kind: PathwaysJob

resources:
  - ../base
