---
apiVersion: batch/v1
kind: Job
metadata:
  name: data-prep
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        # The job is not retried: the cluster autoscaler must not evict the Pod when it
        # scales down or replaces a node
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        app: data-prep
        ml-platform: data-prep
    spec:
      containers:
        - name: job
          image: ${mft_data_preparation_image_url}
          imagePullPolicy: Always
          command: ["ray", "job", "submit"]
          args:
            - "--address"
            - "http://ray-cluster-kuberay-head-svc:8265"
            - "--runtime-env-json"
            - |
              {
                "env_vars": {
                  "BUCKET": "${mft_data_bucket_name}",
                  "DATASET_INPUT_PATH": "flipkart_preprocessed_dataset",
                  "DATASET_INPUT_FILE": "flipkart.csv",
                  "DATASET_OUTPUT_PATH": "dataset/output",
                  "NUM_QUESTIONS": "6",
                  "RAY_DEDUP_LOGS": "0",
                  "SEED": "42"
                }
              }
            - "--working-dir"
            - "/app"
            - "--"
            - "python"
            - "dataprep.py"
          resources:
            requests:
              cpu: 100m
              memory: 1.5Gi
            limits:
              cpu: 250m
              memory: 2Gi
      restartPolicy: Never
      serviceAccountName: ${mft_data_preparation_service_account_name}
