---
apiVersion: batch/v1
kind: Job
metadata:
  name: data-processing
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: data-processing
        ml-platform: data-processing
    spec:
      containers:
        - name: job
          image: ${mft_data_processing_image_url}
          imagePullPolicy: Always
          command: ["ray", "job", "submit"]
          args:
            - "--address"
            - "http://ray-cluster-kuberay-head-svc:8265"
            - "--runtime-env-json"
            - |
              {
                "env_vars": {
                  "DATASET_BUCKET": "${kaggle_bucket_name}",
                  "DATASET_FILE_PATH": "/datasets/PromptCloudHQ/flipkart-products/flipkart_com-ecommerce_sample.csv",
                  "OUTPUT_BUCKET": "${mft_data_bucket_name}",
                  "OUTPUT_CSV_FILE_PATH": "/flipkart_preprocessed_dataset/flipkart.csv",
                  "OUTPUT_IMAGE_FOLDER": "flipkart_images"
                }
              }
            - "--working-dir"
            - "/app"
            - "--"
            - "python"
            - "preprocessing_finetuning.py"
          env:
            - name: "RAY_CLUSTER_HOST"
              value: local
          resources:
            requests:
              cpu: 100m
              memory: 1.5Gi
            limits:
              cpu: 250m
              memory: 2Gi
      restartPolicy: Never
      serviceAccountName: ${mft_data_processing_service_account_name}
