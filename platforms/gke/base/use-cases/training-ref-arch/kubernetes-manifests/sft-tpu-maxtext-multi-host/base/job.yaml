---
apiVersion: pathways-job.pathways.domain/v1
kind: PathwaysJob
metadata:
  name: sft-tpu-maxtext-multi-host
  namespace: replaced-by-kustomize
spec:
  maxRestarts: 0
  pathwaysDir: replaced-by-kustomize
  controller:
    template:
      metadata:
        labels:
          app: sft-trainer
      spec:
        restartPolicy: Never
        containers:
          - name: sft-trainer
            image: replaced-by-kustomize
            command:
              - "/bin/bash"
              - "/train.sh"
            envFrom:
              - configMapRef:
                  name: runtime
            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-secret
                    key: token
            volumeMounts:
              - name: train-script-vol
                mountPath: /train.sh
                subPath: train.sh
              - name: tmp-vol
                mountPath: /tmp
        volumes:
          - name: train-script-vol
            configMap:
              name: train-script
          - name: tmp-vol
            emptyDir: {}
        serviceAccountName: replaced-by-kustomize
  workers:
    - type: replaced-by-kustomize
      topology: replaced-by-kustomize
      numSlices: 1
