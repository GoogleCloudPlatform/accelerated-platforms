---
apiVersion: pathways-job.pathways.domain/v1
kind: PathwaysJob
metadata:
  name: sft-tpu-maxtext-multi-host-eval
  namespace: replaced-by-kustomize
spec:
  maxRestarts: 0
  pathwaysDir: replaced-by-kustomize
  controller:
    template:
      spec:
        restartPolicy: Never
        containers:
          - name: sft-evaluator
            image: replaced-by-kustomize
            envFrom:
              - configMapRef:
                  name: runtime
            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-secret
                    key: token
              - name: EVAL_MODE
                value: "true"
        serviceAccountName: replaced-by-kustomize
  workers:
    - type: replaced-by-kustomize
      topology: replaced-by-kustomize
      numSlices: 1
