---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: "-v5e-4x4-llama-3-1-8b-instruct"

patches:
  - patch: |
      - op: replace
        path: /spec/workers/0/type
        value: ct5lp-hightpu-8t
      - op: replace
        path: /spec/workers/0/topology
        value: 4x4
      - op: add
        path: /spec/controller/template/spec/containers/0/env/-
        value:
          name: MODEL_NAME
          value: "llama3.1-8b"
      - op: add
        path: /spec/controller/template/spec/containers/0/env/-
        value:
          name: TOKENIZER_PATH
          value: "meta-llama/Llama-3.1-8B-Instruct"
      - op: add
        path: /spec/controller/template/spec/containers/0/env/-
        value:
          name: USE_MULTIMODAL
          value: "false"
      - op: add
        path: /spec/controller/template/spec/containers/0/env/-
        value:
          name: SCAN_LAYERS
          value: "true"
    target:
      kind: PathwaysJob
      name: sft-tpu-maxtext-multi-host-eval

replacements:
  - source:
      fieldPath: data.CONTAINER_IMAGE_URL
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.controller.template.spec.containers.[name=sft-evaluator].image
        select:
          kind: PathwaysJob
  - source:
      fieldPath: data.TRAINING_KUBERNETES_NAMESPACE
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - metadata.namespace
        select:
          kind: PathwaysJob
  - source:
      fieldPath: data.TRAINING_KUBERNETES_SERVICE_ACCOUNT
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.controller.template.spec.serviceAccountName
        select:
          kind: PathwaysJob
  - source:
      fieldPath: data.PATHWAYS_DIR
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.pathwaysDir
        select:
          kind: PathwaysJob

resources:
  - ../base
