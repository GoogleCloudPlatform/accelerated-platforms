---
apiVersion: batch/v1
kind: Job
metadata:
  name: gemma4-31b-converter
  namespace: rl-mul-slice-checkpoint-converter
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gemma4-31b-converter
    spec:
      serviceAccountName: rl-mul-slice-checkpoint-converter-sa
      nodeSelector:
        cloud.google.com/compute-class: model-converter
      restartPolicy: OnFailure
      volumes:
      - name: huggingface-token
        csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: 7a4221e9-huggingface-token-read
      - name: scripts
        configMap:
          defaultMode: 0755
          name: 7a4221e9-maxtext-checkpoint-converter-scripts
      - name: ephemeral-cache
        emptyDir:
          sizeLimit: 150Gi
      - name: tmp-cache
        emptyDir:
          sizeLimit: 50Gi
      containers:
      - name: converter
        image: us-docker.pkg.dev/cloud-tpu-images/maxtext-images/tpu_post_training:0.2.3
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args: ["/scripts/convert.sh"]
        env:
        - name: DIRECTION
          value: "to_maxtext"
        - name: MODEL_NAME
          value: "gemma4-31b"
        - name: HF_MODEL_NAME
          value: "google/gemma-4-31b-it"
        - name: BASE_OUTPUT_DIRECTORY
          value: "gs://accelerated-platforms-dev-rl-mul-slice-hf-hub-models/gemma4-31b"
        - name: SCAN_LAYERS
          value: "true"
        - name: HARDWARE
          value: "cpu"
        - name: LAZY_LOAD_TENSORS
          value: "true"
        resources:
          requests:
            cpu: "16"
            memory: "96Gi"
            ephemeral-storage: "100Gi"
          limits:
            cpu: "32"
            memory: "160Gi"
            ephemeral-storage: "250Gi"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: huggingface-token
          mountPath: /var/run/secrets/huggingface.co
          readOnly: true
        - name: ephemeral-cache
          mountPath: /root/.cache
        - name: tmp-cache
          mountPath: /tmp
