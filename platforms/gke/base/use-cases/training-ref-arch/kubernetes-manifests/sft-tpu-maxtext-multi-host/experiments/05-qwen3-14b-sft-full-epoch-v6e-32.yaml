---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-14b-sft-full-epoch
  namespace: rl-mul-slice-checkpoint-converter
spec:
  clusterIP: None
  selector:
    job-name: qwen3-14b-sft-full-epoch
  ports:
  - name: jax-mesh
    port: 8471
    targetPort: 8471
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-14b-sft-full-epoch
  namespace: rl-mul-slice-checkpoint-converter
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 8
  backoffLimit: 0
  template:
    metadata:
      labels:
        job-name: qwen3-14b-sft-full-epoch
    spec:
      subdomain: qwen3-14b-sft-full-epoch
      restartPolicy: OnFailure
      serviceAccountName: rl-mul-slice-checkpoint-converter-sa
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 4x8
        cloud.google.com/reservation-affinity: specific
        cloud.google.com/reservation-name: multihost-rl-128-tpu-v6e
        topology.kubernetes.io/zone: us-east5-a
      tolerations:
      - key: google.com/tpu
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: huggingface-token
        csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: 7a4221e9-huggingface-token-read
      containers:
      - name: maxtext-sft
        image: us-docker.pkg.dev/cloud-tpu-images/maxtext-images/tpu_post_training:0.2.3
        imagePullPolicy: IfNotPresent
        env:
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow-tracking-svc.rl-mul-slice-rl-mlflow.svc.cluster.local:5000"
        volumeMounts:
        - name: huggingface-token
          mountPath: /var/run/secrets/huggingface.co
          readOnly: true
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -ex
          export HF_TOKEN=$(cat /var/run/secrets/huggingface.co/token)
          export JAX_COORDINATOR_ADDRESS="qwen3-14b-sft-full-epoch-0.qwen3-14b-sft-full-epoch.rl-mul-slice-checkpoint-converter.svc.cluster.local:8471"
          export JAX_PROCESS_ID=${JOB_COMPLETION_INDEX}
          export NNODES=8
          export JAX_NUM_PROCESSES=8

          pip install --no-cache-dir mlflow-skinny -q

          python3 -m maxtext.trainers.post_train.sft.train_sft \
            src/maxtext/configs/post_train/sft.yml \
            run_name="qwen3-14b-sft-full-epoch" \
            base_output_directory="gs://accelerated-platforms-dev-rl-mul-slice-hf-hub-models/qwen3-14b-sft-full-epoch" \
            model_name="qwen3-14b" \
            load_parameters_path="gs://accelerated-platforms-dev-rl-mul-slice-hf-hub-models/qwen3-14b/qwen3-14b/0/items" \
            per_device_batch_size=2 \
            max_target_length=2048 \
            steps=3248 \
            eval_interval=500 \
            eval_steps=100 \
            eval_split="test_sft" \
            checkpoint_period=500 \
            async_checkpointing=True \
            checkpoint_storage_use_zarr3=1 \
            checkpoint_storage_use_ocdbt=1 \
            dataset_type=hf \
            hf_path="HuggingFaceH4/ultrachat_200k" \
            train_split="train_sft" \
            train_data_columns="['messages']" \
            tokenizer_type=huggingface \
            tokenizer_path="Qwen/Qwen3-14B" \
            scan_layers=True \
            hf_access_token="${HF_TOKEN}" \
            managed_mldiagnostics=False
        resources:
          requests:
            google.com/tpu: "4"
          limits:
            google.com/tpu: "4"
