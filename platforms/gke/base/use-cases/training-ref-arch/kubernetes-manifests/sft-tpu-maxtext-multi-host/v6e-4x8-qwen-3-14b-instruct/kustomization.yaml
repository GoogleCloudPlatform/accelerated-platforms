---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: "-v6e-4x8-qwen-3-14b"

patches:
  - patch: |
      - op: replace
        path: /spec/workers/0/type
        value: ct6e-standard-4t
      - op: replace
        path: /spec/workers/0/topology
        value: 4x8
      - op: replace
        path: /spec/workers/0/numSlices
        value: 1
      - op: add
        path: /spec/controller/template/spec/containers/0/env/-
        value:
          name: MODEL_NAME
          value: "qwen3-14b"
      - op: add
        path: /spec/controller/template/spec/containers/0/env/-
        value:
          name: TOKENIZER_PATH
          value: "Qwen/Qwen3-14B"
      - op: add
        path: /spec/controller/template/spec/containers/0/env/-
        value:
          name: SCAN_LAYERS
          value: "true"
      - op: add
        path: /spec/controller/template/spec/containers/0/env/-
        value:
          name: MAX_TARGET_LENGTH
          value: "2048"
    target:
      kind: PathwaysJob
      name: sft-tpu-maxtext-multi-host

replacements:
  - source:
      fieldPath: data.CONTAINER_IMAGE_URL
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.controller.template.spec.containers.[name=sft-trainer].image
        select:
          kind: PathwaysJob
  - source:
      fieldPath: data.TRAINING_KUBERNETES_NAMESPACE
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - metadata.namespace
        select:
          kind: PathwaysJob
  - source:
      fieldPath: data.TRAINING_KUBERNETES_SERVICE_ACCOUNT
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.controller.template.spec.serviceAccountName
        select:
          kind: PathwaysJob
  - source:
      fieldPath: data.PATHWAYS_DIR
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.pathwaysDir
          - spec.controller.template.spec.containers.[name=sft-trainer].env.[name=GCS_OUTPUT_PATH].value
        select:
          kind: PathwaysJob

resources:
  - ../base
