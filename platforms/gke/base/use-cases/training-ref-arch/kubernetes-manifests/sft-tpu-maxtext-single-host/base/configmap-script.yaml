---
apiVersion: v1
kind: ConfigMap
metadata:
  name: train-script
  namespace: replaced-by-kustomize
data:
  train.sh: |
    #!/usr/bin/env bash
    set -ex

    CONFIG_YML_PATH=$(python3 -c "from maxtext.utils.globals import MAXTEXT_PKG_DIR; print(f'{MAXTEXT_PKG_DIR}/configs/post_train/sft.yml')")
    if [[ ! -f "${CONFIG_YML_PATH}" ]]; then
      CONFIG_YML_PATH="src/maxtext/configs/post_train/sft.yml"
    fi

    echo "Starting MaxText SFT Training..."
    echo "Model Name: ${MODEL_NAME:-${HF_MODEL_NAME}}"
    echo "Load Path: ${LOAD_PARAMETERS_PATH}"
    echo "Output Path: ${BASE_OUTPUT_DIRECTORY}"
    echo "Run Name: ${RUN_NAME}"

    # If HF_TOKEN is not set, try to read from the mounted secret volume
    if [[ -z "${HF_TOKEN:-}" ]]; then
      TOKEN_PATH="/var/run/secrets/huggingface.co/token"
      if [[ -f "${TOKEN_PATH}" ]]; then
        export HF_TOKEN=$(cat "${TOKEN_PATH}")
        echo "Loaded HF_TOKEN from mounted secret provider volume."
      else
        echo "WARNING: HF_TOKEN is not set and no mounted token file was found at ${TOKEN_PATH}."
      fi
    fi

    python3 -m maxtext.trainers.post_train.sft.train_sft \
      ${CONFIG_YML_PATH} \
      run_name=${RUN_NAME} \
      base_output_directory=${BASE_OUTPUT_DIRECTORY} \
      model_name=${MODEL_NAME:-${HF_MODEL_NAME}} \
      load_parameters_path=${LOAD_PARAMETERS_PATH} \
      per_device_batch_size=${PER_DEVICE_BATCH_SIZE:-1} \
      steps=${STEPS:-1000} \
      eval_interval=${EVAL_INTERVAL:-100} \
      eval_steps=${EVAL_STEPS:-10} \
      eval_split="${EVAL_SPLIT:-test_sft}" \
      checkpoint_period=${CHECKPOINT_PERIOD:-100} \
      async_checkpointing=${ASYNC_CHECKPOINTING:-True} \
      dataset_type=${DATASET_TYPE:-hf} \
      hf_path="${HF_PATH:-HuggingFaceH4/ultrachat_200k}" \
      train_split="${TRAIN_SPLIT:-train_sft}" \
      train_data_columns="${TRAIN_DATA_COLUMNS:-['messages']}" \
      tokenizer_type=${TOKENIZER_TYPE:-huggingface} \
      tokenizer_path="${TOKENIZER_PATH:-${HF_MODEL_NAME}}" \
      scan_layers=${SCAN_LAYERS:-True} \
      use_multimodal=${USE_MULTIMODAL:-False} \
      hf_access_token="${HF_TOKEN}" \
      managed_mldiagnostics=False \
      skip_jax_distributed_system=True
