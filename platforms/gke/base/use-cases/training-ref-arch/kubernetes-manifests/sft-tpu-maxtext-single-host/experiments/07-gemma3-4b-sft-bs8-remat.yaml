---
apiVersion: batch/v1
kind: Job
metadata:
  name: gemma3-4b-sft-bs8-remat
  namespace: rl-mul-slice-checkpoint-converter
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gemma3-4b-sft-bs8-remat
    spec:
      restartPolicy: Never
      serviceAccountName: rl-mul-slice-checkpoint-converter-sa
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 2x4
        cloud.google.com/reservation-affinity: specific
        cloud.google.com/reservation-name: multihost-rl-128-tpu-v6e
        topology.kubernetes.io/zone: us-east5-a
      volumes:
      - name: huggingface-token
        csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: 7a4221e9-huggingface-token-read
      containers:
      - name: maxtext-sft
        image: us-docker.pkg.dev/cloud-tpu-images/maxtext-images/tpu_post_training:0.2.3
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -ex
          export HF_TOKEN=\$(cat /var/run/secrets/huggingface.co/token)

          python3 -m maxtext.trainers.post_train.sft.train_sft \
            src/maxtext/configs/post_train/sft.yml \
            run_name="gemma3-4b-sft-bs8-remat" \
            base_output_directory="gs://accelerated-platforms-dev-rl-mul-slice-hf-hub-models/gemma3-4b-sft-bs8-remat" \
            model_name="gemma3-4b" \
            load_parameters_path="gs://accelerated-platforms-dev-rl-mul-slice-hf-hub-models/gemma3-4b/0/items" \
            per_device_batch_size=8 \
            max_target_length=1024 \
            remat_policy="full" \
            steps=1000 \
            eval_interval=100 \
            eval_steps=10 \
            eval_split="test_sft" \
            checkpoint_period=100 \
            async_checkpointing=True \
            dataset_type=hf \
            hf_path="HuggingFaceH4/ultrachat_200k" \
            train_split="train_sft" \
            train_data_columns="['messages']" \
            tokenizer_type=huggingface \
            tokenizer_path="google/gemma-3-4b-it" \
            scan_layers=True \
            hf_access_token="\${HF_TOKEN}" \
            managed_mldiagnostics=False \
            skip_jax_distributed_system=True
        resources:
          requests:
            google.com/tpu: "8"
          limits:
            google.com/tpu: "8"
        volumeMounts:
        - name: huggingface-token
          mountPath: /var/run/secrets/huggingface.co
          readOnly: true
