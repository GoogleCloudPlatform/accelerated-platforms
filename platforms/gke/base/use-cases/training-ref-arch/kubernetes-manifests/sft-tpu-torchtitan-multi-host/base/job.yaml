---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
  name: tt-sft-mh
  namespace: replaced-by-kustomize
spec:
  failurePolicy:
    maxRestarts: 0
  network:
    enableDNSHostnames: true
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          backoffLimit: 0
          completionMode: Indexed
          completions: 4
          parallelism: 4
          template:
            metadata:
              annotations:
                cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
                gke-gcsfuse/volumes: "true"
              labels:
                app: sft-torchtitan-trainer
            spec:
              dnsPolicy: ClusterFirstWithHostNet
              hostNetwork: true
              restartPolicy: Never
              serviceAccountName: replaced-by-kustomize
              nodeSelector:
                cloud.google.com/compute-class: tpu-v6e-4x4
                cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
                cloud.google.com/gke-tpu-topology: 4x4
              tolerations:
                - effect: NoSchedule
                  key: google.com/tpu
                  operator: Equal
                  value: present
                - effect: NoSchedule
                  key: cloud.google.com/gke-queued
                  operator: Exists
              initContainers:
                - name: sysctl-tpu-tune
                  image: replaced-by-kustomize
                  securityContext:
                    privileged: true
                  command:
                    - /bin/bash
                    - -c
                    - |
                      sysctl -w vm.max_map_count=8388608
                      rm -f /tmp/libtpu_lockfile
              containers:
                - name: sft-trainer
                  image: replaced-by-kustomize
                  securityContext:
                    privileged: true
                  command:
                    - /bin/bash
                    - /scripts/train.sh
                  envFrom:
                    - configMapRef:
                        name: runtime
                  env:
                    - name: JOB_COMPLETION_INDEX
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
                    - name: JOB_UID
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['batch.kubernetes.io/controller-uid']
                    - name: JOBSET_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          key: token
                          name: hf-secret
                          optional: true
                  resources:
                    limits:
                      google.com/tpu: "4"
                      memory: 128Gi
                    requests:
                      cpu: "32"
                      ephemeral-storage: 40Gi
                      google.com/tpu: "4"
                      memory: 128Gi
                  volumeMounts:
                    - mountPath: /scripts/train.sh
                      name: train-script-vol
                      subPath: train.sh
                    - mountPath: /dev/shm
                      name: dshm
                    - mountPath: /gcs
                      name: gcs-output
              volumes:
                - configMap:
                    defaultMode: 0755
                    name: train-script
                  name: train-script-vol
                - emptyDir:
                    medium: Memory
                    sizeLimit: 32Gi
                  name: dshm
                - csi:
                    driver: gcsfuse.csi.storage.gke.io
                    volumeAttributes:
                      bucketName: replaced-by-kustomize
                      hostNetworkPodKSA: "true"
                      mountOptions: "implicit-dirs,metadata-cache:ttl-secs:0,file-cache:max-size-mb:32768,file-cache:enable-parallel-downloads:true"
                  name: gcs-output
