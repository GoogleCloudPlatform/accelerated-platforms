---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: "-v6e-4x4-gemma-4-12b"

patches:
  - path: patch-workers.yaml
    target:
      kind: JobSet
      name: tt-sft-mh
  - path: patch-env.yaml
    target:
      kind: JobSet
      name: tt-sft-mh

replacements:
  - source:
      fieldPath: data.CONTAINER_IMAGE_URL
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.replicatedJobs.0.template.spec.template.spec.initContainers.[name=sysctl-tpu-tune].image
          - spec.replicatedJobs.0.template.spec.template.spec.containers.[name=sft-trainer].image
        select:
          kind: JobSet
  - source:
      fieldPath: data.TRAINING_KUBERNETES_NAMESPACE
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - metadata.namespace
        select:
          kind: JobSet
      - fieldPaths:
          - metadata.namespace
        select:
          kind: ConfigMap
  - source:
      fieldPath: data.TRAINING_KUBERNETES_SERVICE_ACCOUNT
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.replicatedJobs.0.template.spec.template.spec.serviceAccountName
        select:
          kind: JobSet
  - source:
      fieldPath: data.GCS_OUTPUT_BUCKET
      kind: ConfigMap
      name: runtime
    targets:
      - fieldPaths:
          - spec.replicatedJobs.0.template.spec.template.spec.volumes.[name=gcs-output].csi.volumeAttributes.bucketName
        select:
          kind: JobSet

resources:
  - ../base
