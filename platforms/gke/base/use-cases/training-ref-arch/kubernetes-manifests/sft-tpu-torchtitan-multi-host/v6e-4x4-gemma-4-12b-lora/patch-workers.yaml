---
- op: replace
  path: /spec/replicatedJobs/0/replicas
  value: 1
- op: replace
  path: /spec/replicatedJobs/0/template/spec/completions
  value: 4
- op: replace
  path: /spec/replicatedJobs/0/template/spec/parallelism
  value: 4
- op: replace
  path: /spec/replicatedJobs/0/template/spec/template/spec/nodeSelector
  value:
    cloud.google.com/compute-class: tpu-v6e-4x4
    cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
    cloud.google.com/gke-tpu-topology: 4x4
- op: replace
  path: /spec/replicatedJobs/0/template/spec/template/spec/containers/0/resources
  value:
    limits:
      google.com/tpu: "4"
      memory: 128Gi
    requests:
      cpu: "32"
      ephemeral-storage: 40Gi
      google.com/tpu: "4"
      memory: 128Gi
