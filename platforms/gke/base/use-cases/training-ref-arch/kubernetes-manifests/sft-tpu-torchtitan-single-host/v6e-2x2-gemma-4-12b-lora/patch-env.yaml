---
apiVersion: batch/v1
kind: Job
metadata:
  name: tt-sft-sh
  namespace: replaced-by-kustomize
spec:
  template:
    spec:
      containers:
        - name: sft-trainer
          env:
            - name: TORCHTITAN_CONFIG
              value: gemma4_12b_lora_sft
            - name: NPROC_PER_NODE
              value: "4"
            - name: STEPS
              value: "100"
            - name: SEQ_LEN
              value: "2048"
            - name: LOCAL_BATCH_SIZE
              value: "1"
            - name: LORA_RANK
              value: "16"
            - name: LORA_ALPHA
              value: "32"
            - name: LEARNING_RATE
              value: "1e-4"
            - name: LORA_MERGE_ENABLE
              value: "true"
            - name: EVAL_EXPORT_ROWS
              value: "32"
