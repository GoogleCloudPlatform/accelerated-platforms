apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-collector-script
data:
  collect.py: |
    import os, json, urllib.request, urllib.parse

    access_token_req = urllib.request.Request(
        "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token",
        headers={"Metadata-Flavor": "Google"}
    )
    with urllib.request.urlopen(access_token_req) as resp:
        access_token = json.loads(resp.read().decode('utf-8'))['access_token']

    project_id_req = urllib.request.Request(
        "http://metadata.google.internal/computeMetadata/v1/project/project-id",
        headers={"Metadata-Flavor": "Google"}
    )
    with urllib.request.urlopen(project_id_req) as resp:
        project_id = resp.read().decode('utf-8').strip()

    start = os.environ.get('START_TIME', '')
    end = os.environ.get('END_TIME', '')
    ns = os.environ.get('TARGET_NAMESPACE', 'default')

    # Find latest inference-perf run directory on PVC
    req_dir = '/requests'
    subdirs = []
    if os.path.exists(req_dir):
        for d in os.listdir(req_dir):
            if d.startswith('inference-perf-'):
                full_p = os.path.join(req_dir, d)
                if os.path.isdir(full_p):
                    subdirs.append((os.path.getmtime(full_p), full_p))
    subdirs.sort(reverse=True)

    if not subdirs:
        print('{"error": "No results directory found on PVC"}')
        exit(1)

    latest_dir = subdirs[0][1]
    print(f"Collecting DCGM telemetry for run dir: {latest_dir}")

    metrics = [
        'kubernetes.io/container/accelerator/duty_cycle',
        'kubernetes.io/container/accelerator/memory_used',
        'kubernetes.io/container/accelerator/memory_total',
        'kubernetes.io/container/accelerator/memory_bandwidth_utilization',
        'prometheus.googleapis.com/DCGM_FI_DEV_GPU_UTIL/gauge',
        'prometheus.googleapis.com/DCGM_FI_PROF_GR_ENGINE_ACTIVE/gauge',
        'prometheus.googleapis.com/DCGM_FI_PROF_SM_ACTIVE/gauge',
        'prometheus.googleapis.com/DCGM_FI_DEV_FB_USED/gauge',
        'prometheus.googleapis.com/DCGM_FI_DEV_FB_FREE/gauge',
        'prometheus.googleapis.com/DCGM_FI_DEV_FB_TOTAL/gauge',
        'prometheus.googleapis.com/DCGM_FI_DEV_MEM_COPY_UTIL/gauge',
        'prometheus.googleapis.com/DCGM_FI_PROF_DRAM_ACTIVE/gauge',
        'prometheus.googleapis.com/DCGM_FI_PROF_PIPE_TENSOR_ACTIVE/gauge',
        'prometheus.googleapis.com/DCGM_FI_PROF_PIPE_FP16_ACTIVE/gauge',
        'prometheus.googleapis.com/DCGM_FI_PROF_PIPE_FP32_ACTIVE/gauge',
        'prometheus.googleapis.com/DCGM_FI_PROF_PIPE_FP64_ACTIVE/gauge',
        'prometheus.googleapis.com/DCGM_FI_DEV_GPU_TEMP/gauge',
        'prometheus.googleapis.com/DCGM_FI_DEV_MEMORY_TEMP/gauge',
        'prometheus.googleapis.com/DCGM_FI_DEV_SM_CLOCK/gauge',
    ]

    all_series = []
    for m in metrics:
        filter_str = f'metric.type="{m}" AND resource.labels.pod_name = monitoring.regex.full_match(".*vllm.*|.*modelservice.*|.*prefill.*|.*decode.*")'
        encoded = urllib.parse.quote(filter_str)
        url = f'https://monitoring.googleapis.com/v3/projects/{project_id}/timeSeries?filter={encoded}&interval.startTime={start}&interval.endTime={end}'
        req = urllib.request.Request(url, headers={'Authorization': f'Bearer {access_token}'})
        try:
            with urllib.request.urlopen(req) as resp:
                data = json.loads(resp.read().decode('utf-8'))
                if 'timeSeries' in data:
                    all_series.extend(data['timeSeries'])
        except Exception:
            pass

    result = {'timeSeries': all_series}
    out_path = os.path.join(latest_dir, 'dcgm_metrics.json')
    with open(out_path, 'w') as f:
        json.dump(result, f, indent=2)

    print(f'Saved {len(all_series)} timeSeries to {out_path}')
---
apiVersion: batch/v1
kind: Job
metadata:
  name: telemetry-collector
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: inference-perf-runner
      restartPolicy: OnFailure
      containers:
        - name: collector
          image: ghcr.io/llm-d/llm-d-benchmark:v0.7.0
          command: ["python3", "/scripts/collect.py"]
          env:
            - name: TARGET_NAMESPACE
              value: "TARGET_NAMESPACE_PLACEHOLDER"
            - name: START_TIME
              value: "START_TIME_PLACEHOLDER"
            - name: END_TIME
              value: "END_TIME_PLACEHOLDER"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
            - name: requests
              mountPath: /requests
      volumes:
        - name: script-vol
          configMap:
            name: telemetry-collector-script
        - name: requests
          persistentVolumeClaim:
            claimName: workload-pvc

