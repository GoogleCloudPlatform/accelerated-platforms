apiVersion: batch/v1
kind: Job
metadata:
  name: telemetry-collector
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: inference-perf-runner
      restartPolicy: OnFailure
      containers:
        - name: collector
          image: ghcr.io/llm-d/llm-d-benchmark:v0.7.0
          command: ["/bin/bash", "/scripts/collect.sh"]
          env:
            - name: TARGET_NAMESPACE
              value: "TARGET_NAMESPACE_PLACEHOLDER"
            - name: START_TIME
              value: "START_TIME_PLACEHOLDER"
            - name: END_TIME
              value: "END_TIME_PLACEHOLDER"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
            - name: requests
              mountPath: /requests
      volumes:
        - name: script-vol
          configMap:
            name: telemetry-collector-script
        - name: requests
          persistentVolumeClaim:
            claimName: workload-pvc
